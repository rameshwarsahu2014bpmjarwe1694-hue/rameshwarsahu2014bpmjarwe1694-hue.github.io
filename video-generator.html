<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Lecture Video Generator</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }
        h2 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
        }
        #auth-status {
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
            color: #666;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        input[type="file"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #fafafa;
        }
        .row {
            display: flex;
            gap: 10px;
        }
        .row .form-group {
            flex: 1;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        #loading {
            display: none;
            text-align: center;
            margin-top: 20px;
            color: #007bff;
            font-weight: bold;
        }
        #result-section {
            margin-top: 30px;
            display: none;
            text-align: center;
        }
        video {
            width: 100%;
            border-radius: 8px;
            margin-top: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .script-box {
            text-align: left;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            max-height: 150px;
            overflow-y: auto;
            font-size: 14px;
            color: #444;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Book Notes se Lecture Video Banayein</h2>
    <div id="auth-status">🔄 Firebase Authentication check ho rahi hai...</div>
    
    <form id="videoForm">
        <div class="form-group">
            <label for="pdfFile">Apne Notes ki PDF File Upload Karein:</label>
            <input type="file" id="pdfFile" name="notes" accept=".pdf" required>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="startPage">Start Page (Optional):</label>
                <input type="number" id="startPage" name="startPage" placeholder="Jaise: 1" min="1">
            </div>
            <div class="form-group">
                <label for="endPage">End Page (Optional):</label>
                <input type="number" id="endPage" name="endPage" placeholder="Jaise: 3" min="1">
            </div>
        </div>
        
                <!-- Purane ek button ki jagah yeh 3 step buttons -->
        <button type="button" id="btnStep1" class="btn-step1" onclick="runStep1()" style="background-color: #007bff; margin-bottom: 10px;">Step 1: Extract Text / OCR</button>
        <button type="button" id="btnStep2" class="btn-step2" onclick="runStep2()" disabled style="background-color: #6c757d; margin-bottom: 10px; cursor: not-allowed;">Step 2: Generate Audio & Slides</button>
        <button type="button" id="btnStep3" class="btn-step3" onclick="runStep3()" disabled style="background-color: #6c757d; margin-bottom: 10px; cursor: not-allowed;">Step 3: Compile Final Video</button>

        <div id="statusLog" style="background: #f8f9fa; border: 1px solid #ddd; padding: 10px; height: 100px; overflow-y: auto; font-family: monospace; font-size: 12px; margin-top: 10px;">Status: Awaiting action...</div>
    </form>

    <div id="loading">⏳ Video render ho rahi hai (Isme 1-2 minute lag sakte hain)...</div>

    <div id="result-section">
        <h3>Aapka Lecture Video Taiyar Hai!</h3>
        <video id="videoPlayer" controls></video>
        <br><br>
        
        <!-- Native APK Download Bridge Integration -->
        <button id="downloadBtn" type="button" style="background-color: #28a745; display: none;">Video Download Karein</button>

        <!-- Naya Audio Player -->
        <br><br>
        <h4>Teacher Audio:</h4>
        <audio id="audioPlayer" controls style="width: 100%; margin-top: 10px; display: none;"></audio>

        <h4>Generated Teacher Script:</h4>
        <div class="script-box" id="scriptText"></div>
    </div>
</div>

<script type="module" nonce="{{NONCE}}"
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const BACKEND_URL = "https://payment-backend-2-g6go.onrender.com";
    let currentUserToken = null;
    let currentVideoUrl = '';

    async function initApp() {
    try {
        console.log("🔥 Firebase initialization started");
        console.log("Backend URL:", BACKEND_URL);

        const configRes = await fetch(`${BACKEND_URL}/firebase-config`);

        console.log("HTTP Status:", configRes.status);
        console.log("Response OK:", configRes.ok);
        console.log("Response Headers:",
            Object.fromEntries(configRes.headers.entries())
        );

        const responseText = await configRes.clone().text();
        console.log("Raw Firebase Config Response:", responseText);

        if (!configRes.ok) throw new Error("Firebase config load failed");

        const firebaseConfig = await configRes.json();

        console.log("Firebase Config:", firebaseConfig);
        console.log("API Key Present:", !!firebaseConfig.apiKey);
        console.log("Auth Domain:", firebaseConfig.authDomain);
        console.log("Project ID:", firebaseConfig.projectId);
        console.log("App ID Present:", !!firebaseConfig.appId);

        console.log("Initializing Firebase App...");
        const app = initializeApp(firebaseConfig);
        console.log("Firebase App Initialized:", app.name);

        const auth = getAuth(app);
        console.log("Firebase Auth Initialized:", auth);

        onAuthStateChanged(auth, async (user) => {
            console.log("Auth State Changed:", user);

            if (user) {
                console.log("User Logged In:", user.email);

                currentUserToken = await user.getIdToken();
                console.log("Firebase Token Generated Successfully");

                document.getElementById('auth-status').innerHTML =
                    `✅ Logged in as: ${user.email}`;
            } else {
                console.log("No User Logged In");
                currentUserToken = null;

                document.getElementById('auth-status').innerHTML =
                    `⚠️ Kripya pehle login karein!`;
            }
        });

    } catch (err) {
        console.error("❌ FIREBASE ERROR:", err);
        console.error("Error Name:", err.name);
        console.error("Error Message:", err.message);
        console.error("Error Stack:", err.stack);

        document.getElementById('auth-status').innerHTML =
            `❌ Setup Error: ${err.message}`;
    }
}

    initApp();

        let extractedTextGlobal = "";
    let step2DataCache = {};

    function log(message) {
        const box = document.getElementById('statusLog');
        if(box) { box.innerHTML += `<br>> ${message}`; box.scrollTop = box.scrollHeight; }
    }

    window.runStep1 = async function() {
        if (!currentUserToken) { alert("Pehle login karein!"); return; }
        const fileInput = document.getElementById('pdfFile');
        if (!fileInput.files[0]) { alert("Kripya PDF file select karein!"); return; }

        const formData = new FormData();
        formData.append('notes', fileInput.files[0]);
        formData.append('startPage', document.getElementById('startPage').value);
        formData.append('endPage', document.getElementById('endPage').value);

        log("Step 1 Started: Extracting text...");
        document.getElementById('btnStep1').disabled = true;

        try {
            const res = await fetch(`${BACKEND_URL}/api/step1-extract`, {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + currentUserToken },
                body: formData
            });
            const data = await res.json();
            if (data.success) {
                extractedTextGlobal = data.extractedText;
                log(`✔ Text extracted successfully!`);
                const b2 = document.getElementById('btnStep2');
                b2.disabled = false; b2.style.background = "#28a745"; b2.style.cursor = "pointer";
            } else {
                log("❌ Error: " + data.error);
                document.getElementById('btnStep1').disabled = false;
            }
        } catch (err) {
            log("❌ Step 1 Failed: " + err.message);
            document.getElementById('btnStep1').disabled = false;
        }
    };

    window.runStep2 = async function() {
        log("Step 2 Started: Generating audio & slides...");
        document.getElementById('btnStep2').disabled = true;

        try {
            const res = await fetch(`${BACKEND_URL}/api/step2-generate-assets`, {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + currentUserToken, 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: extractedTextGlobal })
            });
            const data = await res.json();

            if (data.success) {
                step2DataCache = data;
                log(`✔ Audio & Slides created successfully!`);
                document.getElementById('scriptText').innerText = data.script;
                if (data.audioUrl) {
                    const audioPlayer = document.getElementById('audioPlayer');
                    audioPlayer.src = data.audioUrl.startsWith('http') ? data.audioUrl : BACKEND_URL + data.audioUrl;
                    audioPlayer.style.display = 'block';
                }
                const b3 = document.getElementById('btnStep3');
                b3.disabled = false; b3.style.background = "#ffc107"; b3.style.color = "black"; b3.style.cursor = "pointer";
            } else {
                log("❌ Error: " + data.error);
                document.getElementById('btnStep2').disabled = false;
            }
        } catch (err) {
            log("❌ Step 2 Failed: " + err.message);
            document.getElementById('btnStep2').disabled = false;
        }
    };

    window.runStep3 = async function() {
        log("Step 3 Started: Compiling final video via FFmpeg...");
        document.getElementById('btnStep3').disabled = true;

        try {
            const res = await fetch(`${BACKEND_URL}/api/step3-compile-video`, {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + currentUserToken, 'Content-Type': 'application/json' },
                body: JSON.stringify({ audioPath: step2DataCache.audioPath, slideImages: step2DataCache.slideImages })
            });
            const data = await res.json();

            if (data.success) {
                log("🎉 Video ready!");
                document.getElementById('result-section').style.display = 'block';
                currentVideoUrl = data.videoUrl.startsWith('http') ? data.videoUrl : BACKEND_URL + data.videoUrl;
                document.getElementById('videoPlayer').src = currentVideoUrl;
                document.getElementById('downloadBtn').style.display = 'block';
                alert("🎉 Video safalpurvak generate ho gayi hai!");
            } else {
                log("❌ Error: " + data.error);
                document.getElementById('btnStep3').disabled = false;
            }
        } catch (err) {
            log("❌ Step 3 Failed: " + err.message);
            document.getElementById('btnStep3').disabled = false;
        }
    };


    // In-App Download Handler using Native Android Bridge or Fallback Link
    document.getElementById('downloadBtn').addEventListener('click', function() {
        if (!currentVideoUrl) return;
        
        const fileName = "lecture_video.mp4";

        // Agar native Android WebView bridge available hai toh uske zariye download karein
        if (window.AndroidBridge && typeof window.AndroidBridge.download === 'function') {
            window.AndroidBridge.download(currentVideoUrl, fileName, currentUserToken || "");
        } else {
            // Normal browser fallback
            const a = document.createElement('a');
            a.href = currentVideoUrl;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    });

    document.getElementById('videoForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        if (!currentUserToken) {
            alert("Aap authenticated nahi hain! Kripya pehle login karein.");
            return;
        }

        const fileInput = document.getElementById('pdfFile');
        if (fileInput.files.length === 0) {
            alert("Kripya ek PDF file select karein!");
            return;
        }

        const formData = new FormData();
        formData.append('notes', fileInput.files[0]);
        formData.append('startPage', document.getElementById('startPage').value);
        formData.append('endPage', document.getElementById('endPage').value);

        const loadingDiv = document.getElementById('loading');
        const resultSection = document.getElementById('result-section');
        const submitBtn = document.getElementById('submitBtn');

        loadingDiv.style.display = 'block';
        resultSection.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.innerText = "Video ban rahi hai...";

        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 180000); // 180,000 ms = 3 minutes
            
            const response = await fetch(`${BACKEND_URL}/api/generate-video-from-pdf`, {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + currentUserToken
                },
                body: formData,
                signal: controller.signal // 👈 Yeh timer ko fetch request se jodta hai
            });

            clearTimeout(timeoutId);
            const contentType = response.headers.get("content-type");
            if (!contentType || !contentType.includes("application/json")) {
                const errText = await response.text();
                throw new Error("Server Error: " + errText.substring(0, 100));
            }

            const data = await response.json();

            if (response.ok && data.success) {
                loadingDiv.style.display = 'none';
                resultSection.style.display = 'block';

                if (data.videoUrl) {
                    currentVideoUrl = data.videoUrl.startsWith('http') ? data.videoUrl : BACKEND_URL + data.videoUrl;
                    document.getElementById('videoPlayer').src = currentVideoUrl;
                    document.getElementById('videoPlayer').style.display = 'block';
                    document.getElementById('downloadBtn').style.display = 'block';
                } else {
                    document.getElementById('videoPlayer').style.display = 'none';
                    document.getElementById('downloadBtn').style.display = 'none';
                }

                if (data.audioUrl) {
                    const audioFullUrl = data.audioUrl.startsWith('http') ? data.audioUrl : BACKEND_URL + data.audioUrl;
                    const audioPlayer = document.getElementById('audioPlayer');
                    audioPlayer.src = audioFullUrl;
                    audioPlayer.style.display = 'block';
                }

                document.getElementById('scriptText').innerText = data.script || '';
                alert("🎉 Video safalpurvak generate ho gayi hai!");
            } else {
                throw new Error(data.error || 'Video generation failed');
            }

        } catch (error) {
            console.error('Error:', error);
            alert('Error: ' + error.message);
            loadingDiv.style.display = 'none';
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "Video Generate Karein";
        }
    });
</script>

</body>
</html>
