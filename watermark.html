<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"/>
<meta name="HandheldFriendly" content="true">
<meta name="MobileOptimized" content="320">
<meta name="format-detection" content="telephone=no">
<title>RAMESHWAR SAHU GDS - Logo Watermark</title>
<style>
*{box-sizing:border-box;-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;width:100%;max-width:100%;overflow-x:hidden;background:#fff;color:#09090b;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.45}
.wrap{width:100%;max-width:640px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:10px;border-bottom:1px solid #e4e4e7;padding-bottom:14px;margin-bottom:18px}
.badge{flex:0 0 auto;width:36px;height:36px;border-radius:8px;background:#0b2a6b;color:#fff;display:grid;place-items:center;font-weight:900;font-size:16px}
h1{font-size:16px;margin:0;letter-spacing:-.01em;line-height:1.2;word-break:break-word}
h1 small{display:block;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#52525b;margin-top:3px;font-weight:500}
h2{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#52525b;margin:20px 0 8px;font-weight:600;border-top:1px solid #e4e4e7;padding-top:14px}
label{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#52525b;margin-bottom:5px;font-weight:600}
.dropzone,.logobox{border:2px dashed #e4e4e7;border-radius:10px;padding:18px 12px;text-align:center;background:#fff;cursor:pointer;color:#52525b;word-break:break-word}
.dropzone.drag,.logobox.drag{border-color:#0b2a6b;background:#fafafe;color:#09090b}
.dropzone strong,.logobox strong{display:block;color:#09090b;font-size:14px;margin-top:4px}
.dropzone .hint,.logobox .hint{font-size:11px;margin-top:4px;color:#71717a}
.logobox{display:flex;align-items:center;gap:12px;justify-content:flex-start;text-align:left;padding:12px}
.logobox img{max-width:60px;max-height:60px;object-fit:contain;border-radius:6px;background:#f4f4f5;padding:4px;flex:0 0 auto}
.logobox .lhint{flex:1}
.logobox .lhint strong{display:block;color:#09090b;font-size:13.5px;margin:0}
.logobox .lhint span{font-size:11px;color:#71717a}
.choose-btn{display:inline-block;background:#0b2a6b;color:#fff;padding:8px 14px;border-radius:6px;font-size:12.5px;font-weight:600;margin-top:6px;border:0;cursor:pointer}
.clear-logo{background:none;border:0;color:#dc2626;font-size:12px;cursor:pointer;font-weight:600;padding:4px 8px;flex:0 0 auto}
.meta{margin-top:10px;padding:9px 11px;border:1px solid #e4e4e7;border-radius:8px;background:#f4f4f5;font-size:12px;display:flex;justify-content:space-between;gap:8px;align-items:center;word-break:break-all}
.meta b{font-weight:600;color:#09090b;max-width:65%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta code{font-family:ui-monospace,monospace;font-size:11px;color:#52525b;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:480px){.grid{grid-template-columns:1fr 1fr}}
.controls{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px}
@media(min-width:480px){.controls{grid-template-columns:1fr 1fr}}
.slider-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-size:11px;color:#52525b}
input[type=range]{width:100%;margin:0;accent-color:#0b2a6b}
select{width:100%;border:1px solid #e4e4e7;border-radius:6px;padding:9px 11px;font-size:14px;background:#fff;color:#09090b}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:12.5px;color:#09090b}
.switch input{appearance:none;-webkit-appearance:none;width:36px;height:21px;background:#d4d4d8;border-radius:999px;position:relative;transition:.15s;cursor:pointer;flex:0 0 auto}
.switch input:checked{background:#0b2a6b}
.switch input::after{content:"";position:absolute;width:17px;height:17px;background:#fff;border-radius:50%;top:2px;left:2px;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked::after{left:17px}
button.primary{background:#0b2a6b;color:#fff;border:0;padding:12px 18px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;width:100%}
button.primary:active{background:#081f50}
button.primary:disabled{opacity:.5;cursor:not-allowed}
button.ghost{background:#fff;border:1px solid #e4e4e7;padding:12px 14px;border-radius:8px;font-weight:500;font-size:13px;cursor:pointer;color:#09090b}
.actions{display:flex;gap:8px;margin-top:16px}
.actions button.primary{flex:1}
.status{font-size:11.5px;color:#52525b;margin-top:10px;font-family:ui-monospace,monospace;word-break:break-word}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid #e4e4e7;padding-top:12px;margin-top:14px}
.stripe{height:5px;background:repeating-linear-gradient(-45deg,rgba(11,42,107,.2) 0 2px,transparent 2px 12px);margin-bottom:18px;border-radius:3px}
</style>
</head>
<body>
<div class="wrap">
<div class="stripe"></div>
<header>
<div class="badge">R</div>
<h1>RAMESHWAR SAHU GDS<small>Logo Watermark - Center Stamp</small></h1>
</header>

<h2>01 - Choose PDF</h2>
<div id="dropzone" class="dropzone">
<div style="font-size:22px">PDF</div>
<strong>Tap to choose PDF file</strong>
<div class="hint">Auto-stamps when both PDF and Logo are loaded.</div>
<button type="button" class="choose-btn" onclick="document.getElementById('file').click()">Choose PDF</button>
<input id="file" type="file" accept="application/pdf,.pdf" hidden />
</div>
<div id="meta" class="meta" style="display:none"><b id="fname"></b><code id="fsize"></code></div>

<h2>02 - Choose Logo</h2>
<div id="logobox" class="logobox">
<img id="logoPreview" src="" alt="" style="display:none"/>
<div class="lhint">
<strong>Tap to choose your logo</strong>
<span>PNG (transparent) ya JPG. Center pe stamp lagega.</span>
<br><button type="button" class="choose-btn" onclick="document.getElementById('logoFile').click()">Choose Logo</button>
</div>
<button id="clearLogo" class="clear-logo" style="display:none" type="button">Remove</button>
<input id="logoFile" type="file" accept="image/*" hidden />
</div>

<h2>03 - Settings</h2>
<div class="grid">
<div>
<label>Layout</label>
<select id="layout">
<option value="center" selected>Single Center Stamp</option>
<option value="diagonal">Diagonal Tile (repeating)</option>
</select>
</div>
<div>
<label>Rotation</label>
<select id="rotation">
<option value="0" selected>0 deg (Straight)</option>
<option value="-15">-15 deg</option>
<option value="-30">-30 deg</option>
<option value="-45">-45 deg</option>
<option value="30">+30 deg</option>
<option value="45">+45 deg</option>
</select>
</div>
</div>

<div class="controls">
<div><div class="slider-row"><label style="margin:0">Opacity</label><span id="opVal">18%</span></div>
<input id="opacity" type="range" min="3" max="60" step="1" value="18"/></div>
<div><div class="slider-row"><label style="margin:0">Size</label><span id="szVal">65%</span></div>
<input id="size" type="range" min="20" max="95" step="1" value="65"/></div>
</div>

<div class="opt">
<label class="switch">Auto-Download <input id="autoDl" type="checkbox" checked/></label>
</div>

<div class="actions">
<button id="process" class="primary" disabled>Process and Download</button>
<button id="reset" class="ghost">Reset</button>
</div>
<div id="status" class="status">Awaiting PDF + Logo.</div>
</div>

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
(function(){
var $=function(id){return document.getElementById(id)};
var fileInput=$("file"),dropzone=$("dropzone"),meta=$("meta"),fname=$("fname"),fsize=$("fsize");
var logoFile=$("logoFile"),logobox=$("logobox"),logoPreview=$("logoPreview"),clearLogo=$("clearLogo");
var layoutEl=$("layout"),rotEl=$("rotation");
var opEl=$("opacity"),opVal=$("opVal"),szEl=$("size"),szVal=$("szVal");
var autoDl=$("autoDl");
var btn=$("process"),resetBtn=$("reset"),statusEl=$("status");
var selectedPdf=null, logoBytes=null, logoMime=null;

function fmt(b){return b<1024?b+" B":b<1048576?(b/1024).toFixed(1)+" KB":(b/1048576).toFixed(2)+" MB"}
function setStatus(m){statusEl.textContent=m}
function ready(){btn.disabled = !(selectedPdf && logoBytes)}

function setPdf(f){
  if(!f) return;
  if(!/\.pdf$/i.test(f.name)&&f.type!=="application/pdf"){setStatus("Only PDF supported.");return}
  selectedPdf=f; meta.style.display="flex";
  fname.textContent=f.name; fsize.textContent=fmt(f.size);
  ready(); setStatus(logoBytes?"Ready to stamp.":"PDF loaded. Now choose your logo.");
  if(autoDl.checked && logoBytes) process();
}
function setLogo(f){
  if(!f) return;
  var t = (f.type||"").toLowerCase();
  if(!/^image\/(png|jpe?g)$/.test(t) && !/\.(png|jpe?g)$/i.test(f.name)){
    setStatus("Logo must be PNG or JPG.");return
  }
  var reader = new FileReader();
  reader.onload = function(ev){
    logoBytes = ev.target.result;
    logoMime = /\.png$/i.test(f.name) || t==="image/png" ? "image/png" : "image/jpeg";
    var url = URL.createObjectURL(f);
    logoPreview.src = url;
    logoPreview.style.display = "block";
    clearLogo.style.display = "inline-block";
    ready();
    setStatus(selectedPdf?"Ready to stamp.":"Logo loaded. Now choose a PDF.");
    if(autoDl.checked && selectedPdf) process();
  };
  reader.readAsArrayBuffer(f);
}

dropzone.addEventListener("click",function(e){
  if(e.target.tagName!=="BUTTON") fileInput.click();
});
dropzone.addEventListener("dragover",function(e){e.preventDefault();dropzone.classList.add("drag")});
dropzone.addEventListener("dragleave",function(){dropzone.classList.remove("drag")});
dropzone.addEventListener("drop",function(e){e.preventDefault();dropzone.classList.remove("drag");setPdf(e.dataTransfer.files[0])});
fileInput.addEventListener("change",function(e){setPdf(e.target.files[0])});

logobox.addEventListener("click",function(e){
  if(e.target.id!=="clearLogo" && e.target.tagName!=="BUTTON") logoFile.click();
});
logobox.addEventListener("dragover",function(e){e.preventDefault();logobox.classList.add("drag")});
logobox.addEventListener("dragleave",function(){logobox.classList.remove("drag")});
logobox.addEventListener("drop",function(e){e.preventDefault();logobox.classList.remove("drag");setLogo(e.dataTransfer.files[0])});
logoFile.addEventListener("change",function(e){setLogo(e.target.files[0])});
clearLogo.addEventListener("click",function(e){
  e.stopPropagation();
  logoBytes=null; logoMime=null;
  logoPreview.src=""; logoPreview.style.display="none";
  clearLogo.style.display="none"; logoFile.value="";
  ready(); setStatus(selectedPdf?"Logo removed.":"Awaiting PDF + Logo.");
});

opEl.addEventListener("input",function(){opVal.textContent=opEl.value+"%"});
szEl.addEventListener("input",function(){szVal.textContent=szEl.value+"%"});

resetBtn.addEventListener("click",function(){
  layoutEl.value="center"; rotEl.value="0";
  opEl.value=18; szEl.value=65; autoDl.checked=true;
  selectedPdf=null; logoBytes=null; logoMime=null;
  fileInput.value=""; logoFile.value=""; meta.style.display="none";
  logoPreview.src=""; logoPreview.style.display="none"; clearLogo.style.display="none";
  btn.disabled=true;
  opEl.dispatchEvent(new Event("input")); szEl.dispatchEvent(new Event("input"));
  setStatus("Awaiting PDF + Logo.");
});
btn.addEventListener("click",process);

async function process(){
  if(!selectedPdf){setStatus("Select a PDF first.");return}
  if(!logoBytes){setStatus("Upload a logo first.");return}
  var layout=layoutEl.value;
  var rot=parseInt(rotEl.value,10);
  var opacity=Math.max(0.03,Math.min(0.6,parseInt(opEl.value,10)/100));
  var sizePct=Math.max(0.20,Math.min(0.95,parseInt(szEl.value,10)/100));
  btn.disabled=true; setStatus("Embedding logo watermark...");
  try{
    var P=PDFLib;
    var buf=await selectedPdf.arrayBuffer();
    var pdf=await P.PDFDocument.load(buf,{ignoreEncryption:true,updateMetadata:false});
    var img;
    if(logoMime==="image/png") img = await pdf.embedPng(logoBytes);
    else                       img = await pdf.embedJpg(logoBytes);
    var pages=pdf.getPages();
    pages.forEach(function(page){
      var s=page.getSize(), width=s.width, height=s.height;
      var targetW = width * sizePct;
      var scaled  = img.scaleToFit(targetW, height*sizePct);
      var w = scaled.width, h = scaled.height;
      if(layout==="center"){
        var rad = rot * Math.PI / 180;
        var cosA = Math.cos(rad), sinA = Math.sin(rad);
        var cx = width/2, cy = height/2;
        var ax = cx - (cosA*(w/2) - sinA*(h/2));
        var ay = cy - (sinA*(w/2) + cosA*(h/2));
        page.drawImage(img,{x:ax,y:ay,width:w,height:h,opacity:opacity,rotate:P.degrees(rot)});
      } else {
        var tileW=w, tileH=h, stepX=tileW*1.25, stepY=tileH*1.25, row=0;
        for(var y=-stepY; y<height+stepY; y+=stepY, row++){
          var off = (row%2===0)?0:stepX/2;
          for(var x=-stepX+off; x<width+stepX; x+=stepX){
            page.drawImage(img,{x:x,y:y,width:tileW,height:tileH,opacity:opacity,rotate:P.degrees(rot)});
          }
        }
      }
    });
    var bytes=await pdf.save();
    var outName=selectedPdf.name.replace(/\.pdf$/i,"")+"_watermarked.pdf";
    var blob=new Blob([bytes],{type:"application/pdf"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a"); a.href=url; a.download=outName;
    document.body.appendChild(a); a.click();
    setTimeout(function(){URL.revokeObjectURL(url);a.remove()},1000);
    var diff=bytes.length-selectedPdf.size;
    var sign=diff>=0?"+":"";
    setStatus("Done: "+outName+" - "+fmt(bytes.length)+" ("+sign+fmt(Math.abs(diff))+" vs source)");
  }catch(e){console.error(e); setStatus("Failed: "+(e.message||e))}
  finally{btn.disabled=false}
}
})();
</script>
</body>
</html>
