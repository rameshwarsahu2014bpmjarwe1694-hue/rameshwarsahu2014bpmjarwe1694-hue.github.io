<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
  (function () {
    const RZP_BACKEND_URL = "https://payment-backend-2-g6go.onrender.com";
    const getAuthInstance = () =>
  (typeof auth !== "undefined" && auth) ? auth : (window.firebaseAuth || null);
      
    if (window.top !== window.self) {
  try {
    window.top.location = window.self.location.href;
  } catch (_) {
    window.self.location.replace(window.self.location.href);
  }
    }
      

        Object.defineProperty(window, "startRazorpayNotesCheckout", {
      writable: false,
      configurable: false,
      value: async function ({
          
      category = "",
      subject = "",
      title = "GDS Notes PDF",
      onVerifiedSuccess = null
    } = {}) {
              // Android APK: Native Razorpay Checkout
      if (
        window.AndroidBridge &&
        typeof window.AndroidBridge.startRazorpayNotesCheckout === "function"
      ) {
        const currentAuth = getAuthInstance();
        const idToken = currentAuth?.currentUser
          ? await currentAuth.currentUser.getIdToken()
          : "";

        if (!idToken) {
          alert("Please login before payment.");
          return;
        }

        window.__nativeRazorpaySuccess =
          typeof onVerifiedSuccess === "function"
            ? onVerifiedSuccess
            : null;

        console.log("[RZP_FRONTEND] Native checkout branch reached");

console.log("[RZP_FRONTEND] Checkout request:", {
  category: category,
  subject: subject,
  title: title,
  androidBridge: !!window.AndroidBridge,
  bridgeMethod: typeof window.AndroidBridge?.startRazorpayNotesCheckout,
  loggedIn: !!idToken
});

window.AndroidBridge.startRazorpayNotesCheckout(
  String(category || ""),
  String(subject || ""),
  String(title || "GDS Notes PDF"),
  idToken,
  String(currentAuth.currentUser.email || "")
);

console.log("[RZP_FRONTEND] Android checkout request sent");

        return;
      }
      if (typeof window.Razorpay !== "function") {
        alert("Razorpay checkout script load nahi ho payi. Kripya page refresh karein.");
        return;
      }

      let createdOrderId = null;

            try {
        const currentAuth = (typeof auth !== "undefined" && auth) ? auth : (window.firebaseAuth || null);
        const idToken = currentAuth?.currentUser ? await currentAuth.currentUser.getIdToken() : "";
        if (!idToken) { alert("Please login before payment."); return; }

        // Amount server.js par decide hoga; frontend sirf item details bhejega
        const orderRes = await fetch(`${RZP_BACKEND_URL}/api/create-order`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${idToken}` },
          body: JSON.stringify({
            itemType: "notes",
            category,
            subject,
            currency: "INR",
            receipt: `notes_${Date.now()}`
          })
        });

        const orderData = await orderRes.json().catch(() => ({}));
        if (!orderRes.ok || !orderData.order_id || !orderData.key_id || !orderData.amount) {
          throw new Error(orderData.error || "Order create karne me samasya aayi.");
        }

        createdOrderId = orderData.order_id;

        const options = {
          key: orderData.key_id,
          amount: orderData.amount,
          currency: orderData.currency || "INR",
          name: "RAMESHWAR SAHU STUDY HUB",
          description: title || `${category} - ${subject} Notes`,
          order_id: orderData.order_id,
            method: {
            upi: true,
            card: true,
            netbanking: true
            },
                    prefill: {
            email: currentAuth?.currentUser?.email || ""
          },
          handler: async function (response) {
            try {
              const currentAuth = (typeof auth !== "undefined" && auth)
                ? auth
                : (window.firebaseAuth || null);
              const idToken = currentAuth?.currentUser
                ? await currentAuth.currentUser.getIdToken()
                : "";

              const verifyRes = await fetch(`${RZP_BACKEND_URL}/api/verify-payment`, {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  ...(idToken ? { "Authorization": `Bearer ${idToken}` } : {})
                },
                body: JSON.stringify({
                  razorpay_payment_id: response.razorpay_payment_id,
                  razorpay_order_id: response.razorpay_order_id,
                  razorpay_signature: response.razorpay_signature,
                  category,
                  subject
                })
              });

              const verifyData = await verifyRes.json().catch(() => ({}));
              if (!verifyRes.ok || !verifyData.success) {
                alert(verifyData.error || "Payment signature verify nahi ho paya.");
                return;
              }

              alert(`Payment verified! Payment ID: ${verifyData.payment_id}`);
              if (typeof onVerifiedSuccess === "function") {
                onVerifiedSuccess(verifyData, { category, subject, title });
              }
            } catch (err) {
              alert("Server se payment verify karne me network error aaya.");
            }
          },

         modal: {
            ondismiss: async function () {
              try {
                const currentAuth = getAuthInstance();
                const idToken = currentAuth?.currentUser
                  ? await currentAuth.currentUser.getIdToken()
                  : "";

                await fetch(`${RZP_BACKEND_URL}/api/payment-failure`, {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                    ...(idToken ? { "Authorization": `Bearer ${idToken}` } : {})
                  },
                  body: JSON.stringify({
                    order_id: createdOrderId,
                    reason: "Checkout modal closed by user"
                  })
                });
              } catch (_) {}
              alert("Payment cancel kar diya gaya.");
            }
           }
            
        });            

        const rzp = new window.Razorpay(options);

                rzp.on("payment.failed", async function (resp) {
          const errMsg = resp?.error?.description || "Payment fail ho gaya. Kripya dobara koshish karein.";
          const failedOrderId = resp?.error?.metadata?.order_id || createdOrderId;
          const failedPaymentId = resp?.error?.metadata?.payment_id || "";

          try {
            const currentAuth = getAuthInstance();
            const idToken = currentAuth?.currentUser
              ? await currentAuth.currentUser.getIdToken()
              : "";

            await fetch(`${RZP_BACKEND_URL}/api/payment-failure`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                ...(idToken ? { "Authorization": `Bearer ${idToken}` } : {})
              },
              body: JSON.stringify({
                order_id: failedOrderId,
                payment_id: failedPaymentId,
                reason: errMsg
              })
            });
          } catch (_) {}

          alert(errMsg);
        });

        rzp.open();
      } catch (err) {
        alert(err.message || "Checkout shuru nahi ho paya.");
      }
      }
    });
        Object.defineProperty(window, "restoreRazorpayPurchase", {
      writable: false,
      configurable: false,
      value: async function ({ category = "", subject = "", onRestoredSuccess = null } = {}) {
          
            try {
        const currentAuth = getAuthInstance();
        const idToken = currentAuth?.currentUser ? await currentAuth.currentUser.getIdToken() : "";
        if (!idToken) return alert("Please login first.");

        const paymentId = prompt("Apna 12-digit UPI Transaction ID (ya pay_... ID) dalein (Auto-check ke liye khali chhod kar OK dabayein):");
        if (paymentId === null) return;

        const res = await fetch(`${RZP_BACKEND_URL}/api/restore-purchase`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${idToken}` },
          body: JSON.stringify({ payment_id: paymentId.trim(), category, subject })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.success) return alert(data.error || "Verification failed.");

        alert("PDF Unlocked Successfully!");
        if (typeof onRestoredSuccess === "function") onRestoredSuccess(data);
      } catch (err) {
        alert(err.message || "Restore karne me network ya server error aaya.");
      }
      }
    });
      
  })();
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, getDocs, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // YEH RAHA AAPKA RENDER URL
    const BACKEND_URL = "https://payment-backend-2-g6go.onrender.com";
    let auth, db;
    (async () => {
           setFloatingLoading(true, "Connecting server...");
    try {
    // Backend se Firebase Web Config load karein
    const configRes = await fetch(`${BACKEND_URL}/firebase-config`);

    if (!configRes.ok) {
        throw new Error("Firebase config load failed");
    }
    const firebaseConfig = await configRes.json();

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    window.firebaseAuth = auth;
    const db = getFirestore(app);
    } catch (err) {
            console.error("[FIREBASE_INIT]", err);
            setFloatingLoading(false);
        }
    })();
     console.log("Firebase initialized successfully");
    Object.defineProperty(window, "BACKEND_URL", { value: "https://payment-backend-2-g6go.onrender.com", writable: false, configurable: false });
    
    window.allNotes = [];
window.pendingTxn = null;
window.setFloatingLoading = function (show, text = "Loading...") {
    const loader = document.getElementById("floatingLoader");
    const label = document.getElementById("floatingLoaderText");
    if (!loader) return;
    if (label && text) label.textContent = text;
    loader.classList.toggle("hidden", !show);
};
  const authWaiter = setInterval(() => {
  if (!auth) return;
  clearInterval(authWaiter);
            
onAuthStateChanged(auth, (user) => {
    if (user) {
        window.currentUserEmail = user.email;
        loadNotes();
        // ऑटोमैटिक स्टेटस चेक करने के लिए इंटरवल (हर 10 सेकंड में)
        setInterval(updateUIBasedOnPayment, 10000); 
    } else {
        alert("Step 2 Error: User login nahi hai");
        window.location.href = "login.html";
    }
});
  }, 150);
    

async function loadNotes(){
    const box = document.getElementById("notesList");
    try {
        setFloatingLoading(true, "Loading notes...");
        const q = query(collection(db, "notes"), orderBy("createdAt", "desc"));
        const snap = await getDocs(q);
        window.allNotes = [];
        snap.forEach((doc) => { window.allNotes.push({ id: doc.id, ...doc.data() }); });
        renderNotes(window.allNotes);
        updateUIBasedOnPayment();
    } catch(e) { 
        alert("Step 5 Error (Database): " + e.message);
        box.innerHTML = `<div class="empty">Error loading data.</div>`; }
      setFloatingLoading(false);
}

// यह फंक्शन बटन्स को अपडेट करेगा
async function updateUIBasedOnPayment() {
    if (!auth.currentUser) return;
    const token = await auth.currentUser.getIdToken();
    const buttons = document.querySelectorAll('button[id^="btn-"]');

    for (const btn of buttons) {
        try {
            const res = await fetch(`${BACKEND_URL}/payment-status`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify({ category: btn.dataset.cat || "", subject: btn.dataset.sub || "" })
            });
            const data = await res.json().catch(() => ({}));
            if (res.ok && data.status === "COMPLETED") {
                btn.innerText = "📥 Download PDF";
                btn.style.backgroundColor = "#28a745";
                if (btn.nextElementSibling && btn.nextElementSibling.tagName === "BUTTON") {
                    btn.nextElementSibling.style.display = "none";
                }
            }
        } catch (e) {
            console.error("[NOTES_PAYMENT] UI update error:", e);
        }
    }
}



 window.renderNotes = function(arr){
     console.log("Rendering started for count:", arr.length);
    const box = document.getElementById("notesList");

    if(arr.length === 0){
        box.innerHTML = `<div class="empty">No notes found</div>`;
        return;
    }

        const rawHtml = arr.map((x, idx) => {

        const category = String(x.category || "").replace(/'/g, "\\'");
        const subject = String(x.subject || "").replace(/'/g, "\\'");
        const title = String(x.title || "").replace(/'/g, "\\'");
        const fileName = String(x.fileName || "").replace(/'/g, "\\'");
        const cleanSubKey = String(x.subject || idx).replace(/[^a-zA-Z0-9_-]/g, "_");
        const btnId = `btn-${cleanSubKey}-${idx}`;

        return `
        <div class="note">
            <h3>${safe(x.title)}</h3>

            <div class="meta">
                <span class="tag">📮 ${safe(x.category || "-")}</span>
                <span class="tag">📖 ${safe(x.subject || "-")}</span>
            </div>
            

                        <img
                src="${String(x.imageURL || '').startsWith('https://') ? safe(x.imageURL) : ''}"
                class="preview"
                onerror="this.style.display='none';"
            >

            ${
                x.description
                ? `<div class="desc">${safe(x.description)}</div>`
                : ""
            }

                        <button
                id="${btnId}"
                data-cat="${safe(x.category || "")}"
                data-sub="${safe(x.subject || "")}"

                onclick="handleSecureAccess(
                    '${category}',
                    '${subject}',
                    '${title}',
                    '${fileName}',
                    ${Number(x.price || 0)}
                )"
                style="
                    width:100%;
                    margin-top:15px;
                    background:#355da9;
                    color:white;
                    border:none;
                    padding:12px;
                    border-radius:8px;
                    font-weight:bold;
                    cursor:pointer;
                "
                >
                Pay & Open
            </button>
            <button
                onclick="window.restoreRazorpayPurchase({ category: '${category}', subject: '${subject}', onRestoredSuccess: () => { updateUIBasedOnPayment(); handleSecureAccess('${category}', '${subject}', '${title}', '${fileName}', 0, true); } })"
                style="
                    width:100%;
                    margin-top:8px;
                    background:#f1f5f9;
                    color:#334155;
                    border:1px solid #cbd5e1;
                    padding:9px;
                    border-radius:8px;
                    font-size:13px;
                    font-weight:600;
                    cursor:pointer;
                "
            >
                Already Paid? Unlock Now
            </button>
        </div>
                    
        `;
        }).join('');
    box.innerHTML = window.DOMPurify ? DOMPurify.sanitize(rawHtml, { ADD_ATTR: ['onclick', 'data-cat', 'data-sub'] }) : rawHtml;
};
setFloatingLoading(false);
Object.defineProperty(window, "handleSecureAccess", {
  writable: false,
  configurable: false,
  value: async (category, subject, title, fileName, price, downloadOnly = false) => {
    try {
        if (!auth.currentUser) {
            alert("Security Alert: Pehle login karein!");
            window.location.href = "login.html";
            return;
        }

        const token = await auth.currentUser.getIdToken();
const secureUrl = `${BACKEND_URL}/get-notes-pdf?post=${encodeURIComponent(category)}&subject=${encodeURIComponent(subject)}`;

const checkRes = await fetch(secureUrl, {
    method: "GET",
    headers: {
        "Authorization": `Bearer ${token}`
    }
});


           // 1. Agar payment ho chuka hai (200 OK)
        if (checkRes.status === 200) {
            alert("Payment Verified! Downloading started...");

            const cleanFileName = String(fileName || "").trim();
            const outName = cleanFileName
                ? cleanFileName.replace(/[\/\\]/g, "_")
                : `${category}_${subject}_Notes.pdf`.replace(/[\/\\]/g, "_");
            const identifier = cleanFileName || subject || category;

            const tokenRes = await fetch(`${BACKEND_URL}/get-download-token`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify({
                    fileType: "notes",
                    identifier,
                    fileName: cleanFileName,
                    category,
                    subject
                })
            });

            const tokenData = await tokenRes.json().catch(() => ({}));
            if (!tokenRes.ok || !tokenData.token) {
                alert("Download token generate nahi ho paya.");
                return;
            }

            const signedDownloadUrl =
                `${secureUrl}` +
                `${cleanFileName ? `&fileName=${encodeURIComponent(cleanFileName)}` : ""}` +
                `&token=${encodeURIComponent(tokenData.token)}`;
            // 🚀 Android Native Bridge Handler (PYQ Format)
            if (window.AndroidBridge && typeof AndroidBridge.download === "function") {
                AndroidBridge.download(signedDownloadUrl, outName, token);
                return;
            }

            // Web Fallback Download
            const blobRes = await fetch(signedDownloadUrl, {
                headers: {
                    "Authorization": `Bearer ${token}`
                }
            });
            if (!blobRes.ok) {
                alert("PDF download karne me samasya aayi.");
                return;
            }

            const blob = await blobRes.blob();
            const blobUrl = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.style.display = "none";
            a.href = blobUrl;
            a.download = outName;
            document.body.appendChild(a);
            a.click();

            setTimeout(() => {
                document.body.removeChild(a);
                window.URL.revokeObjectURL(blobUrl);
            }, 1000);
            return;
        }


        // 2. Agar payment pending / missing hai (403 Forbidden)
        if (checkRes.status === 403) {
            if (downloadOnly) {
    alert("Payment abhi complete nahi hua. PDF download locked hai.");
    return;
            }
    window.pendingTxn = { category, subject };
    window.startRazorpayNotesCheckout({
        category,
        subject,
        title,
        onVerifiedSuccess: () => {
            window.handleSecureAccess(category, subject, title, fileName, price);
        }
    });
    return;
}


        // 3. Agar File nahi mili (404 Not Found)
        if (checkRes.status === 404) {
            alert(`File server par nahi mili (${subject}.pdf)`);
            return;
        }

        alert(`Access Error (Code: ${checkRes.status})`);
    } catch (err) {
        alert("Connection error! Please try again.");
    }
    }
});

window.autoCheckPayment = async function(txnId) {
      try {
    if (!auth.currentUser || !txnId) return;
          
    const token = await auth.currentUser.getIdToken();

    const res = await fetch(
        `${BACKEND_URL}/payment-status?txnId=${encodeURIComponent(txnId)}&email=${encodeURIComponent(window.currentUserEmail || "")}`,
        {
            method: "POST",
            headers: { "Authorization": `Bearer ${token}` }
        }
    );

    const data = await res.json().catch(() => null);

    if (res.ok && data?.status === "COMPLETED") {
        if (window.pendingTxn) {
            const { category, subject } = window.pendingTxn;
            const safeFileName = `${String(subject || "Notes").replace(/[^a-zA-Z0-9_-]/g, "_")}.pdf`;
            const secureUrl = `${BACKEND_URL}/get-pdf?year=Notes&post=${encodeURIComponent(category)}&subject=${encodeURIComponent(subject)}`;

            const pdfRes = await fetch(secureUrl, {
    headers: {
        "Authorization": `Bearer ${token}`
    }
});


            if (pdfRes.status === 200) {
                const blob = await pdfRes.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = safeFileName;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
            }

            window.pendingTxn = null;
            setTimeout(() => { window.location.href = "notes.html"; }, 2000);
        }
    } else {
        if (data?.status === "PENDING") {
            alert("आपका पेमेंट अभी 'Pending' है। कृपया एडमिन द्वारा अप्रूव होने का इंतज़ार करें।");
        } else if (data?.status === "NOT_FOUND") {
            alert("ट्रांजैक्शन नहीं मिला। कृपया सही Txn ID का उपयोग करें।");
        }

    }
  } catch (err) {
    console.error("[AUTO_CHECK_PAYMENT]", err);
    alert("Payment status check karne me samasya aayi.");
      }
    
  };


window.safe = function(v){
    return String(v || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

window.applyFilter = function(){

    const q = document.getElementById("searchInput").value.toLowerCase().trim();
    const post = document.getElementById("postFilter").value;
    const sub = document.getElementById("subFilter").value;

    renderNotes(
        window.allNotes.filter(x =>
                        String(x.title || "").toLowerCase().includes(q) &&
            (post === "ALL" || x.category === post) &&
            (sub === "ALL" || x.subject === sub)
        )
    );
}

document.getElementById("searchInput").addEventListener("input", applyFilter);
document.getElementById("postFilter").addEventListener("change", applyFilter);
document.getElementById("subFilter").addEventListener("change", applyFilter);
const urlParams = new URLSearchParams(window.location.search);
const rawTxnId = (urlParams.get("txnId") || "").trim();
const isValidTxnId = /^[a-zA-Z0-9_-]{6,64}$/.test(rawTxnId);

if (isValidTxnId) {
    window.history.replaceState({}, document.title, window.location.pathname);
    const waitForAuthAndCheck = setInterval(() => {
        if (auth.currentUser) {
            clearInterval(waitForAuthAndCheck);
            autoCheckPayment(rawTxnId);
        }
    }, 300);
    setTimeout(() => clearInterval(waitForAuthAndCheck), 10000);
}

    
</script>
