<!DOCTYPE html>
<html lang="hi">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAMESHWAR SAHU AI STUDY HUB</title>
    <style>
        :root { 
            --primary: #007bff; 
            --dark: #2c3e50; 
            --bg: #f0f2f5; 
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: var(--bg); padding: 10px; color: #333; }
        
        .chat-container { 
            max-width: 550px; 
            margin: auto; 
            background: #fff; 
            border-radius: 15px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.1); 
            display: flex; 
            flex-direction: column; 
            height: 92vh; 
        }
        
        .chat-header { 
            background: linear-gradient(135deg, var(--primary), #6f42c1); 
            color: white; 
            padding: 15px; 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 15px 15px 0 0; 
            display: flex; 
            align-items: center; 
            gap: 10px;
        }
        .back-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        
        .message { padding: 12px 16px; border-radius: 12px; max-width: 85%; font-size: 15px; line-height: 1.5; word-wrap: break-word; }
        
        .user-msg { background: var(--primary); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        
        .ai-msg { background: #f1f3f4; color: #2c3e50; align-self: flex-start; border-bottom-left-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        
        /* ⚖️ LEGAL DISCLAIMER BOX STYLE */
        .legal-disclaimer {
            font-size: 11px;
            color: #7f8c8d;
            background: #fff3cd;
            border: 1px solid #ffeeba;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            line-height: 1.4;
        }

        /* Loading Animation */
        .loading-dots { display: flex; gap: 4px; justify-content: center; align-items: center; height: 20px; }
        .dot { width: 8px; height: 8px; background: #90a4ae; border-radius: 50%; animation: blink 1.4s infinite both; }
        .dot:nth-child(2) { animation-delay: .2s; }
        .dot:nth-child(3) { animation-delay: .4s; }
        @keyframes blink { 0% { opacity: .2; } 20% { opacity: 1; } 100% { opacity: .2; } }

        .input-area { display: flex; flex-direction: column; padding: 12px; border-top: 1px solid #eee; background: #fff; border-radius: 0 0 15px 15px; }
        .input-row { display: flex; width: 100%; }
        input { flex: 1; padding: 12px 15px; border: 2px solid #ddd; border-radius: 8px; outline: none; font-size: 15px; transition: border-color 0.3s; }
        input:focus { border-color: var(--primary); }
        
        button.send-btn { background: var(--primary); color: white; border: none; padding: 0 20px; margin-left: 8px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px; }
        button.send-btn:hover { background: #0056b3; }
        
        .footer-note { text-align: center; font-size: 10px; color: #aaa; margin-top: 5px; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <button class="back-btn" onclick="window.location.href='dashboard.html'">⬅ Back</button>
        <span>🤖 RAMESHWAR SAHU AI STUDY HUB</span>
    </div>
    
    <div class="chat-box" id="chatBox">
        <div class="message ai-msg" id="defaultWelcome">
            लोड हो रहा है... कृपया प्रतीक्षा करें...⏳
        </div>
    </div>
    
    <div class="input-area">
        <div class="input-row">
            <input type="text" id="userInput" placeholder="अपना सवाल यहाँ पूछें...">
            <button class="send-btn" id="sendBtn">पूछें</button>
        </div>
        <div class="footer-note">AI महत्वपूर्ण नियमों या डेटा को गलत पेश कर सकता है। कृपया विभागीय गाइड से पुष्टि करें।</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDjzmo0A4KhOkrqFQdOyCEek6bsPF-UVPQ",
        authDomain: "gds-departmental-exam-studyhub.firebaseapp.com",
        projectId: "gds-departmental-exam-studyhub",
        storageBucket: "gds-departmental-exam-studyhub.appspot.com",
        messagingSenderId: "759916756080",
        appId: "1:759916756080:web:7f2c0e66458bd007e888b5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    
    const BACKEND_URL = "https://payment-backend-2-g6go.onrender.com"; 
    
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    function getGreeting() {
        const hour = new Date().getHours();
        if (hour < 12) return "Good Morning 🌅";
        if (hour < 17) return "Good Afternoon ☀️";
        return "Good Evening 🌆";
    }

    function appendMessage(text, className, isHTML = false) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        if (isHTML) {
            msgDiv.innerHTML = text;
        } else {
            msgDiv.innerText = text;
        }
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight; 
    }

    onAuthStateChanged(auth, (user) => {
        if (user) {
            let userName = user.displayName || user.email.split('@')[0];
            const greetingText = getGreeting();
            
            // स्वागत संदेश में लीगल डिस्क्लेमर बॉक्स को जोड़ा गया है
            const welcomeHTML = `
                <b>Hi / Hello, ${greetingText}!</b> 👋<br>
                <b>${userName}</b>, मैं <b>RAMESHWAR SAHU AI STUDY HUB</b> का ऑफिशियल असिस्टेंट हूँ। 🤖<br><br>
                डिपार्टमेंटल परीक्षा (<b>MTS, Postman, Mail Guard, PA/SA</b>) की तैयारी के लिए आप मुझसे कुछ भी पूछ सकते हैं:
                <ul style="margin-left: 20px; margin-top: 5px;">
                    <li>पोस्टल मैनुअल और वॉल्यूम के नियम 📘</li>
                    <li>मैथ्स (Maths) के कठिन सवाल 🧮</li>
                    <li>जीके (GK) और रीजनिंग के प्रश्न 🧠</li>
                </ul>
                <br>
                अपना सवाल नीचे बॉक्स में टाइप करें, मैं तुरंत आपकी मदद करूँगा! ✨
                
                <div class="legal-disclaimer">
                    ⚖️ <b>अस्वीकरण (Disclaimer):</b> यह एक ऑटोमेटेड AI मॉडल है जिसका उद्देश्य केवल शैक्षिक सहायता प्रदान करना है। यह आधिकारिक भारतीय डाक विभाग का टूल नहीं है। परीक्षा में किसी भी नियम या डेटा की सटीकता के लिए कृपया आधिकारिक पोस्टल मैनुअल/गाइड से अवश्य मिलान करें। किसी भी अनजाने त्रुटि के लिए यह ऐप उत्तरदायी नहीं होगा।
                </div>`;

            chatBox.innerHTML = ''; 
            appendMessage(welcomeHTML, 'ai-msg', true);
        } else {
            alert("Security Alert: Please login first!");
            window.location.href = "login.html"; 
        }
    });

    async function askQuestion() {
        const query = userInput.value.trim();
        if (!query) return;

        appendMessage(query, 'user-msg');
        userInput.value = '';

        const loadingHTML = `
            <div class="loading-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>`;
        appendMessage(loadingHTML, 'ai-msg', true);
        const loadingMsgElement = chatBox.lastChild;

        try {
            const response = await fetch(`${BACKEND_URL}/api/ask-ai`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: query, aiType: 'gemini' }) 
            });

            const data = await response.json();
            loadingMsgElement.remove(); 

            if (data.answer) {
                let formattedAnswer = data.answer
                    .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>') 
                    .replace(/\*(.*?)\*/g, '<i>$1</i>')   
                    .replace(/\n/g, '<br>');               

                appendMessage(formattedAnswer, 'ai-msg', true);
            } else {
                appendMessage('क्षमा करें, मैं आपके सवाल का जवाब प्रोसेस नहीं कर पाया। कृपया फिर से प्रयास करें। 🔄', 'ai-msg');
            }
        } catch (error) {
            loadingMsgElement.remove();
            console.error("Frontend Error:", error);
            appendMessage('सर्वर से संपर्क नहीं हो पाया। कृपया अपना इंटरनेट कनेक्शन चेक करें। 🌐', 'ai-msg');
        }
    }

    sendBtn.onclick = askQuestion;
    userInput.onkeypress = (e) => { if (e.key === 'Enter') askQuestion(); };

    /* सुरक्षा नियम */
    document.addEventListener("contextmenu", e => e.preventDefault());
    document.addEventListener("copy", e => e.preventDefault());
    document.addEventListener("cut", e => e.preventDefault());
    document.addEventListener("paste", e => e.preventDefault());
    document.addEventListener("selectstart", e => e.preventDefault());

    document.addEventListener("keydown", function(e) {
        if (e.key === "PrintScreen") {
            if (navigator.clipboard) navigator.clipboard.writeText("");
            alert("Screenshot Disabled");
            e.preventDefault();
        }
        if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "s") e.preventDefault();
        if (e.ctrlKey && e.key.toLowerCase() === "u") e.preventDefault();
        if (e.key === "F12") e.preventDefault();
        if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "i") e.preventDefault();
        if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "j") e.preventDefault();
        if (e.ctrlKey && e.key.toLowerCase() === "s") e.preventDefault();
    });
</script>
</body>
</html>
