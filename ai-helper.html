<!DOCTYPE html>
<html lang="hi">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAMESHWAR SAHU AI STUDY & CREATOR HUB</title>
    <style>
        :root { 
            --primary: #007bff; 
            --dark: #2c3e50; 
            --bg: #f0f2f5; 
            --success: #28a745;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        
        body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            background: var(--bg);
            display: flex;
            overflow: hidden;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 100vh;
            height: 100dvh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background: #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        .chat-header {
            padding: 15px 20px;
            background: var(--dark);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .back-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        .back-btn:hover { background: rgba(255,255,255,0.35); }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f9fafb;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .message { 
    padding: 14px 18px; 
    border-radius: 12px; 
    max-width: 90%; 
    font-size: 15px; 
    line-height: 1.6; 
    word-wrap: break-word;

    -webkit-user-select: text !important;
    user-select: text !important;
    -webkit-touch-callout: default !important;
}

.message * {
    -webkit-user-select: text !important;
    user-select: text !important;
}

input {
    -webkit-user-select: text !important;
    user-select: text !important;
    -webkit-touch-callout: default !important;
}
        .user-msg { background: var(--primary); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-msg { background: #ffffff; color: #2c3e50; align-self: flex-start; border-bottom-left-radius: 2px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid #e1e4e8; }

        .action-card {
            background: #f1f8ff;
            border: 1px solid #c8e1ff;
            padding: 12px 15px;
            border-radius: 8px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .action-btn {
            background: var(--success);
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
        }
        .action-btn:hover { background: #218838; }

        .legal-disclaimer {
            font-size: 11px;
            color: #7f8c8d;
            background: #fff3cd;
            border: 1px solid #ffeeba;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            line-height: 1.4;
        }

        .loading-dots { display: flex; gap: 4px; justify-content: center; align-items: center; height: 20px; }
        .dot { width: 8px; height: 8px; background: #90a4ae; border-radius: 50%; animation: blink 1.4s infinite both; }
        .dot:nth-child(2) { animation-delay: .2s; }
        .dot:nth-child(3) { animation-delay: .4s; }
        @keyframes blink { 0% { opacity: .2; } 20% { opacity: 1; } 100% { opacity: .2; } }

        .input-area { 
            display: flex; 
            flex-direction: column; 
            padding: 15px; 
            border-top: 1px solid #ddd; 
            background: #fff; 
            flex-shrink: 0;
        }
        .input-row { display: flex; width: 100%; gap: 10px; }
        input { flex: 1; padding: 12px 15px; border: 2px solid #ddd; border-radius: 8px; outline: none; font-size: 15px; }
        input:focus { border-color: var(--primary); }
        
        button.send-btn { background: var(--primary); color: white; border: none; padding: 0 25px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px; }
        button.send-btn:hover { background: #0056b3; }
        
        .footer-note { text-align: center; font-size: 11px; color: #aaa; margin-top: 8px; }

.attach-btn {
    background: #eaf3ff;
    color: #0066cc;
    font-size: 23px;
    width: 43px;
    height: 43px;
    border: 1px solid #b9d7ff;
    border-radius: 50%;
    cursor: pointer;
}

#attachmentPreview {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
}

.attachment-item {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #f1f5f9;
    border: 1px solid #dce3eb;
    padding: 7px;
    border-radius: 9px;
    max-width: 100%;
    font-size: 12px;
}

.attachment-item img {
    width: 42px;
    height: 42px;
    object-fit: cover;
    border-radius: 5px;
}

.remove-attachment {
    border: 0;
    background: #ffe5e5;
    color: #d00;
    border-radius: 50%;
    width: 25px;
    height: 25px;
    cursor: pointer;
}

#userInput {
    min-width: 0;
}

@media(max-width:480px) {
    .chat-header span {
        font-size: 12px;
    }

    .input-area {
        padding: 10px;
    }

    button.send-btn {
        padding: 0 15px;
    }
}
        
.text-tools {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
}

.text-tools button {
    background: #f1f5f9;
    color: #263238;
    border: 1px solid #d5dce5;
    padding: 8px 14px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
}

        .input-area {
    position: relative; /* Ye zaroori hai taaki popup menu sahi jagah set ho */
}

/* Naya Gemini Style Popup Menu */
.attach-menu {
    position: absolute;
    bottom: 75px;
    left: 15px;
    background: #ffffff;
    border: 1px solid #d5dce5;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    border-radius: 16px;
    padding: 12px;
    display: flex;
    gap: 12px;
    z-index: 100;
}

.attach-menu[hidden] {
    display: none !important;
}

.tool-card {
    background: #f8f9fa;
    border: 1px solid #e1e8ed;
    color: #2c3e50;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    min-width: 70px;
    transition: all 0.2s;
}

.tool-card:hover {
    background: #eef4ff;
    border-color: var(--primary);
    color: var(--primary);
}

.tool-card span.icon {
    font-size: 22px;
}
        
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <button class="back-btn" onclick="window.location.href='dashboard.html'">⬅ Back</button>
        <span style="font-weight: bold;">🤖 RAMESHWAR SAHU AI STUDY HUB (Smart Assistant)</span>
    </div>
    
    <div class="chat-box" id="chatBox">
        <div class="message ai-msg" id="defaultWelcome">
            लोड हो रहा है... कृपया प्रतीक्षा करें...⏳
        </div>
    </div>
    
    
<div class="input-area">

    
<!-- Gemini Style Popup Menu Box -->
<div id="attachMenu" hidden class="attach-menu">
    <button type="button" class="tool-card" onclick="triggerInput('galleryInput')">
        <span class="icon">🖼️</span>
        <span>फ़ोटो</span>

        <span>कैमरा</span>
    </button>

    <button type="button" class="tool-card" onclick="triggerInput('fileInput')">
        <span class="icon">📁</span>
        <span>फ़ाइलें</span>
    </button>
</div>

<div class="composer-tools">
    <button type="button" class="attach-btn" id="attachToggleBtn">
        +
    </button>
</div>


    <input type="file" id="galleryInput"
        accept="image/*" multiple hidden>

    <input type="file" id="cameraInput"
        accept="image/*" capture="environment" hidden>

    <input type="file" id="fileInput"
        accept="image/*,.pdf,application/pdf" multiple hidden>

    <div id="attachmentPreview"></div>
    

    <div class="text-tools">

            placeholder="यहाँ अपना सवाल लिखें...">

        <button class="send-btn" id="sendBtn">भेजें</button>
    </div>

    <div class="footer-note">
        AI महत्वपूर्ण नियमों या डेटा को गलत पेश कर सकता है।
        कृपया विभागीय गाइड से पुष्टि करें।
    </div>

</div>


<script type="module">
    const BACKEND_URL = "https://payment-backend-2-g6go.onrender.com"
    let auth;
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    
const attachmentPreview = document.getElementById('attachmentPreview');

let selectedFiles = [];

const MAX_FILES = 5;
const MAX_FILE_SIZE = 10 * 1024 * 1024;
const attachMenu = document.getElementById('attachMenu');
const attachToggleBtn = document.getElementById('attachToggleBtn');

// + button dabane par menu toggle hoga
attachToggleBtn.onclick = (e) => {
    e.stopPropagation();
    attachMenu.hidden = !attachMenu.hidden;
};

// Menu ke bahar kahin bhi click karne par menu band ho jayega
document.addEventListener('click', (e) => {
    if (!attachMenu.contains(e.target) && e.target !== attachToggleBtn) {
        attachMenu.hidden = true;
    }
});

// Option click hone par file input trigger hoga aur menu band ho jayega
window.triggerInput = function(inputId) {
    document.getElementById(inputId).click();
    attachMenu.hidden = true;
};

// Input par focus hone par bhi menu hide ho jaye
userInput.addEventListener('focus', () => {
    attachMenu.hidden = true;
});
    

function addFiles(files) {

    for (const file of files) {

        const isImage = file.type.startsWith('image/');
        const isPDF = file.type === 'application/pdf' ||
                      file.name.toLowerCase().endsWith('.pdf');

        if (!isImage && !isPDF) {
            alert('केवल Image और PDF स्वीकार हैं।');
            continue;
        }

        if (file.size > MAX_FILE_SIZE || file.size === 0) {
            alert('File खाली है या 10 MB से बड़ी है।');
            continue;
        }

        if (selectedFiles.length >= MAX_FILES) {
            alert('एक बार में अधिकतम 5 Files चुन सकते हैं।');
            break;
        }

        if (selectedFiles.some(f =>
            f.name === file.name &&
            f.size === file.size &&
            f.lastModified === file.lastModified
        )) continue;

        selectedFiles.push(file);
    }

    renderAttachments();
}

function renderAttachments() {

    attachmentPreview.innerHTML = '';

    selectedFiles.forEach((file, index) => {

        const item = document.createElement('div');
        item.className = 'attachment-item';

        if (file.type.startsWith('image/')) {

            const img = document.createElement('img');
            const objectUrl = URL.createObjectURL(file);

            img.src = objectUrl;
            img.onload = () => URL.revokeObjectURL(objectUrl);

            item.appendChild(img);

        } else {

            const pdfIcon = document.createElement('span');
            pdfIcon.textContent = '📄 PDF';
            item.appendChild(pdfIcon);
        }

        const name = document.createElement('span');
        name.textContent = file.name;

        item.appendChild(name);

        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'remove-attachment';
        remove.textContent = '×';

        remove.onclick = () => {
            selectedFiles.splice(index, 1);
            renderAttachments();
        };

        item.appendChild(remove);
        attachmentPreview.appendChild(item);
    });
}

document.getElementById('galleryInput').addEventListener(
    'change', e => {
        addFiles(e.target.files);
        e.target.value = '';
    }
);

document.getElementById('cameraInput').addEventListener(
    'change', e => {
        addFiles(e.target.files);
        e.target.value = '';
    }
);

document.getElementById('fileInput').addEventListener(
    'change', e => {
        addFiles(e.target.files);
        e.target.value = '';
    }
);


window.selectAllText = function() {
    userInput.focus();
    userInput.select();
}

window.copyText = async function() {
    userInput.focus();
    if (!userInput.value) return;
    userInput.select();
    try {
        await navigator.clipboard.writeText(userInput.value);
    } catch (e) {
        document.execCommand('copy');
    }
}

window.pasteText = async function() {
    userInput.focus();
    try {
        const text = await navigator.clipboard.readText();
        const start = userInput.selectionStart;
        const end = userInput.selectionEnd;
        userInput.setRangeText(text, start, end, 'end');
    } catch (e) {}
}


    

    function appendMessage(text, className, isHTML = false) {
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${className}`;

    if (isHTML) msgDiv.innerHTML = text;
    else msgDiv.innerText = text;

    chatBox.appendChild(msgDiv);

    // AI message ke liye Copy button
    if (className === 'ai-msg' && !msgDiv.querySelector('.loading-dots')) {
        const copyBtn = document.createElement('button');

        copyBtn.type = 'button';
        copyBtn.textContent = '📋 Copy';
        copyBtn.style.cssText =
            'display:block;margin-top:12px;padding:8px 16px;background:#007bff;color:white;border:0;border-radius:6px;font-weight:bold;cursor:pointer;';

        copyBtn.onclick = async () => {
            const clone = msgDiv.cloneNode(true);
            clone.querySelectorAll('button').forEach(btn => btn.remove());

            const copyText = clone.innerText.trim();

            try {
                await navigator.clipboard.writeText(copyText);
                copyBtn.textContent = '✅ Copied';
            } catch (error) {
                const area = document.createElement('textarea');
                area.value = copyText;
                document.body.appendChild(area);
                area.select();

                const copied = document.execCommand('copy');
                area.remove();

                copyBtn.textContent = copied ? '✅ Copied' : '❌ Copy Failed';
            }
        };

        msgDiv.appendChild(copyBtn);
    }

    chatBox.scrollTop = chatBox.scrollHeight;
}
        async function initApp() {
        try {
             const [{ initializeApp }, { getAuth, onAuthStateChanged },{ getFirestore, doc, getDoc } ] = await Promise.all([
                import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
                import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"),
                import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js")
            ]);

            const configRes = await fetch(`${BACKEND_URL}/firebase-config`, { cache: "no-store" });
            if (!configRes.ok) throw new Error("Config load failed");
            const firebaseConfig = await configRes.json();

            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            const db = getFirestore(app);

            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    const candidateSnap = await getDoc(doc(db, "candidates", user.uid));
const candidateData = candidateSnap.exists() ? candidateSnap.data() : {};
let userName = candidateData.name || user.displayName || "Student";
                 const welcomeMsg = document.getElementById('defaultWelcome');

if (welcomeMsg) {
    welcomeMsg.innerHTML = `
        <b>स्वागत है, <span id="candidateName"></span>! 👋</b><br>
        मैं <b>RAMESHWAR SAHU AI STUDY HUB</b> का स्मार्ट असिस्टेंट हूँ। 🤖<br><br>
        आप मुझसे किसी भी फीचर के लिए सीधे चैट में बात कर सकते हैं:
        <ul style="margin-left: 20px; margin-top: 5px;">
            <li><b>Excel:</b> "मुझे Excel रिपोर्ट डाउनलोड करनी है"</li>
            <li><b>Maths:</b> "मैथ्स हल करो: (25 * 4) + 10"</li>
            <li><b>Letter/Draft:</b> "विभागीय पत्र ड्राफ्ट करो..."</li>
            <li><b>Video & Slides:</b> "इस टॉपिक पर वीडियो लेक्चर और स्लाइड्स बनाओ..."</li>
            <li><b>Study Q&A:</b> विभागीय परीक्षा, जीके, और पोस्टल रूल्स से जुड़े सवाल</li>
        </ul>
        <br>अपना निर्देश नीचे टाइप करें! ✨`;

    welcomeMsg.querySelector('#candidateName').textContent = userName;
}   
                } else {
                    window.location.href = "login.html"; 
                }
            });
        } catch (err) {
            console.error("Init Error:", err);
        }
    }

    initApp();


    userInput.addEventListener('focus', () => {
        const welcomeElement = document.getElementById('defaultWelcome');
if (welcomeElement) welcomeElement.remove();
    });

    // Smart Conversational Router (All Server Features Integrated)
    async function handleUserMessage() {
        const queryText = userInput.value.trim();
        if (!queryText) return;
         
        const welcomeElement = document.getElementById('defaultWelcome');
if (welcomeElement) welcomeElement.remove();

        appendMessage(queryText, 'user-msg');
        userInput.value = '';

        const lowerQuery = queryText.toLowerCase();

        const loadingHTML = `<div class="loading-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
        appendMessage(loadingHTML, 'ai-msg', true);
        const loadingMsgElement = chatBox.lastChild;

        try {
            const idToken = auth.currentUser ? await auth.currentUser.getIdToken() : "";
            const secureToken = window.APP_SECRET || "";
            let endpoint = `${BACKEND_URL}/api/ask-ai`;
            let payload = { question: queryText };

            // 1. INTENT DETECTION & ROUTING FOR ALL FEATURES

            // 👉 Intent A: Excel Report Download
            if (lowerQuery.includes('excel') || lowerQuery.includes('xlsx') || lowerQuery.includes('शीट डाउनलोड') || lowerQuery.includes('रिपोर्ट डाउनलोड')) {
                loadingMsgElement.remove();
                const excelHTML = `
                    📊 आपकी <b>GDS Exam Excel Report</b> तैयार है! नीचे दिए गए बटन पर क्लिक करके सीधे डाउनलोड करें:
                    <div class="action-card">
                        <span>📁 GDS_Report.xlsx</span>
                        <a href="${BACKEND_URL}/api/generate-excel" class="action-btn" target="_blank">⬇️ Download Excel</a>
                    </div>`;
                appendMessage(excelHTML, 'ai-msg', true);
                return;
            }

            // 👉 Intent B: Math Solver (`/api/solve-math`)
            if (lowerQuery.includes('math') || lowerQuery.includes('हल करो') || lowerQuery.includes('calculate') || (/[\d\+\-\*\/\(\)]+/.test(lowerQuery) && lowerQuery.length < 30)) {
                endpoint = `${BACKEND_URL}/api/solve-math`;
                payload = { expression: queryText.replace(/[^0-9\+\-\*\/\(\)\.\s]/g, '') || queryText };
            } 
            // 👉 Intent C: Video Lecture, Slides & Audio Assets (`/api/step2-generate-assets`)
            else if (lowerQuery.includes('video') || lowerQuery.includes('lecture') || lowerQuery.includes('वीडियो') || lowerQuery.includes('लेक्चर') || lowerQuery.includes('audio') || lowerQuery.includes('slide') || lowerQuery.includes('स्लाइड')) {
                endpoint = `${BACKEND_URL}/api/step2-generate-assets`;
                payload = { text: queryText };
            } 
            // 👉 Intent D: Letter / Application Drafting (`/api/ask-ai`)
            else if (lowerQuery.includes('letter') || lowerQuery.includes('पत्र') || lowerQuery.includes('application') || lowerQuery.includes('draft')) {
                endpoint = `${BACKEND_URL}/api/ask-ai`;
                payload = { question: `एक औपचारिक विभागीय पत्र या आवेदन इस विषय पर ड्राफ्ट करें: ${queryText}` };
            } 
            // 👉 Intent E: General Q&A / Study Hub (`/api/ask-ai`)
            else {
                endpoint = `${BACKEND_URL}/api/ask-ai`;
                payload = { question: queryText };
            }

                        // 2. API REQUEST DISPATCH
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${idToken}`, // 👈 Yeh line zaroori hai
                    'X-Source-Auth': secureToken
                },
                body: JSON.stringify(payload) 
            });

            const data = await response.json();
            loadingMsgElement.remove(); 

            // 3. HANDLE RESPONSES ACCORDING TO ROUTE TYPE
            if (endpoint.includes('solve-math')) {
                if (data.success && data.result !== undefined) {
                    appendMessage(`🧮 गणितीय हल (Math Result): <b>${data.result}</b>`, 'ai-msg', true);
                } else {
                    appendMessage(`⚠️ मैथ्स एक्सप्रेशन हल करने में त्रुटि: ${data.error || 'अमान्य एक्सप्रेशन'}`, 'ai-msg', true);
                }
                } else if (endpoint.includes('step2-generate-assets')) {
                // 🛑 Hardcoded message hata diya gaya hai, ab backend ka real status dikhega
                let assetsHTML = `🎬 <b>Video Lectures, Audio & Slides Successfully Generated!</b><br>`;
                
                if (data.audioUrl) {
                    let finalAudioUrl = data.audioUrl.startsWith('http') ? data.audioUrl : `${BACKEND_URL}${data.audioUrl}`;
                    assetsHTML += `
                        <div class="action-card">
                            <span>🔊 Voiceover Audio Lecture</span>
                            <button onclick="if(window.AndroidBridge) { window.AndroidBridge.download('${finalAudioUrl}', 'Audio_Lecture.mp3', ''); } else { window.open('${finalAudioUrl}', '_blank'); }" class="action-btn" style="cursor:pointer; border:none;">🎧 Play / Download Audio</button>
                        </div>`;
                }

                // 🖼️ Dynamic Slides/Images loop jo backend se aayengi
                if (data.slideImages && data.slideImages.length > 0) {
                    assetsHTML += `<br>🖼️ <b>Total ${data.slideImages.length} Slides Generated:</b><div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;">`;
                    data.slideImages.forEach((imgUrl, index) => {
                        let finalImgUrl = imgUrl.startsWith('http') ? imgUrl : `${BACKEND_URL}${imgUrl}`;
                        assetsHTML += `<button onclick="if(window.AndroidBridge) { window.AndroidBridge.download('${finalImgUrl}', 'Slide_${index + 1}.png', ''); } else { window.open('${finalImgUrl}', '_blank'); }" style="padding:8px 14px; background:#007bff; color:white; border:none; border-radius:6px; cursor:pointer; font-size:13px; font-weight:bold;">⬇️ Slide ${index + 1}</button>`;
                    });
                    assetsHTML += `</div>`;
                } else {
                    assetsHTML += `<br><span style="color: #e74c3c;">⚠️ Koi slide image nahi mili ya render nahi ho payi.</span>`;
                }

                appendMessage(assetsHTML, 'ai-msg', true);

            } else {
                if (data.answer) {
                    let formattedOutput = data.answer.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
                    appendMessage(formattedOutput, 'ai-msg', true);
                } else {
                    appendMessage('क्षमा करें, मैं इस निर्देश को प्रोसेस नहीं कर पाया। कृपया दोबारा प्रयास करें.', 'ai-msg');
                }
            }

        } catch (error) {
            loadingMsgElement.remove();
            console.error("Error:", error);
            appendMessage('सर्वर से संपर्क नहीं हो पाया। कृपया अपना इंटरनेट कनेक्शन जाँचें.', 'ai-msg');
        }
    }

    sendBtn.onclick = handleUserMessage;
    userInput.onkeypress = (e) => { if (e.key === 'Enter') handleUserMessage(); };
</script>
</body>
</html>
