<!DOCTYPE html>
<html lang="hi">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAMESHWAR SAHU AI STUDY HUB</title>
    <style>
        :root { 
            --primary: #007bff; 
            --dark: #2c3e50; 
            --bg: #f0f2f5; 
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
}

.chat-container {
    width: 100%;
    max-width: 550px;
    height: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
}



.chat-header,
.input-area {
    flex-shrink: 0;
}

        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 60px; 
        }
        .back-btn:hover { background: rgba(255, 255, 255, 0.35); }

        /* 🔄 यहाँ सबसे मुख्य बदलाव है: चैट बॉक्स अब पूरी तरह स्क्रॉलेबुल है */
        .chat-box {
    flex: 1 1 0%;
    min-height: 0;
    min-width: 0;
    padding: 15px;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
    touch-action: pan-y;
    display: flex;
    flex-direction: column;
    gap: 12px;
}
        .message { 
            padding: 12px 16px; 
            border-radius: 12px; 
            max-width: 90%; 
            font-size: 15px; 
            line-height: 1.6; 
            word-wrap: break-word; 
        }

        .user-msg { background: var(--primary); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-msg { background: #f1f3f4; color: #2c3e50; align-self: flex-start; border-bottom-left-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }

        .legal-disclaimer {
            font-size: 11px;
            color: #7f8c8d;
            background: #fff3cd;
            border: 1px solid #ffeeba;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            line-height: 1.4;
        }

        .loading-dots { display: flex; gap: 4px; justify-content: center; align-items: center; height: 20px; }
        .dot { width: 8px; height: 8px; background: #90a4ae; border-radius: 50%; animation: blink 1.4s infinite both; }
        .dot:nth-child(2) { animation-delay: .2s; }
        .dot:nth-child(3) { animation-delay: .4s; }
        @keyframes blink { 0% { opacity: .2; } 20% { opacity: 1; } 100% { opacity: .2; } }

        .input-area { 
            display: flex; 
            flex-direction: column; 
            padding: 12px; 
            border-top: 1px solid #eee; 
            background: #fff; 
            flex-shrink: 0; 
        }
        .input-row { display: flex; width: 100%; }
        input { flex: 1; padding: 12px 15px; border: 2px solid #ddd; border-radius: 8px; outline: none; font-size: 15px; }
        input:focus { border-color: var(--primary); }
        
        button.send-btn { background: var(--primary); color: white; border: none; padding: 0 20px; margin-left: 8px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px; }
        button.send-btn:hover { background: #0056b3; }
        
        .footer-note { text-align: center; font-size: 10px; color: #aaa; margin-top: 5px; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <button class="back-btn" onclick="window.location.href='dashboard.html'">⬅ Back</button>
        <span>🤖 RAMESHWAR SAHU AI STUDY HUB</span>
    </div>
    
    <div class="chat-box" id="chatBox">
        <div class="message ai-msg" id="defaultWelcome">
            लोड हो रहा है... कृपया प्रतीक्षा करें...⏳
        </div>
    </div>
    
    <div class="input-area">
        <div class="input-row">
            <input type="text" id="userInput" placeholder="अपना सवाल यहाँ पूछें...">
            <button class="send-btn" id="sendBtn">पूछें</button>
        </div>
        <div class="footer-note">AI महत्वपूर्ण नियमों या डेटा को गलत पेश कर सकता है। कृपया विभागीय गाइड से पुष्टि करें।</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDjzmo0A4KhOkrqFQdOyCEek6bsPF-UVPQ",
        authDomain: "gds-departmental-exam-studyhub.firebaseapp.com",
        projectId: "gds-departmental-exam-studyhub",
        storageBucket: "gds-departmental-exam-studyhub.appspot.com",
        messagingSenderId: "759916756080",
        appId: "1:759916756080:web:7f2c0e66458bd007e888b5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    
    const BACKEND_URL = "https://payment-backend-2-g6go.onrender.com"; 
    
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    function getGreeting() {
        const hour = new Date().getHours();
        if (hour < 12) return "Good Morning 🌅";
        if (hour < 17) return "Good Afternoon ☀️";
        return "Good Evening 🌆";
    }

    function appendMessage(text, className, isHTML = false) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        if (isHTML) {
            msgDiv.innerHTML = text;
        } else {
            msgDiv.innerText = text;
        }
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight; 
    }

    onAuthStateChanged(auth, (user) => {
        if (user) {
            let userName = user.displayName || user.email.split('@')[0];
            const greetingText = getGreeting();
            
            const welcomeHTML = `
                <b>Hi / Hello, ${greetingText}!</b> 👋<br>
                <b>${userName}</b>, मैं <b>RAMESHWAR SAHU AI STUDY HUB</b> का ऑफिशियल असिस्टेंट हूँ। 🤖<br><br>
                डिपार्टमेंटल परीक्षा (<b>MTS, Postman, Mail Guard, PA/SA</b>) की तैयारी के लिए आप मुझसे कुछ भी पूछ सकते हैं:
                <ul style="margin-left: 20px; margin-top: 5px;">
                    <li>पोस्टल मैनुअल और वॉल्यूम के नियम 📘</li>
                    <li>मैथ्स (Maths) के कठिन सवाल 🧮</li>
                    <li>जीके (GK) और रीजनिंग के प्रश्न 🧠</li>
                    <li>IT MODERNIZATION Project & Product & Services & latest Updates प्रश्न 🧠</li>
                </ul>
                <br>
                अपना सवाल नीचे बॉक्स में टाइप करें, मैं तुरंत आपकी मदद करूँगा! ✨
                
                <div class="legal-disclaimer">
                    ⚖️ <b>अस्वीकरण (Disclaimer):</b> यह एक ऑटोमेटेड AI मॉडल है जिसका उद्देश्य केवल शैक्षिक सहायता प्रदान करना है। यह आधिकारिक भारतीय डाक विभाग का टूल नहीं है। परीक्षा में किसी भी नियम या डेटा की सटीकता के लिए कृपया आधिकारिक पोस्टल मैनुअल/गाइड से अवश्य मिलान करें। किसी भी अनजाने त्रुटि के लिए यह ऐप उत्तरदायी नहीं होगा।
                </div>`;

            chatBox.innerHTML = ''; 
            
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ai-msg';
            msgDiv.id = 'welcomeMsg'; 
            msgDiv.innerHTML = welcomeHTML;
            chatBox.appendChild(msgDiv);
        } else {
            alert("Security Alert: Please login first!");
            window.location.href = "login.html"; 
        }
    });

    // 🎯 जैसे ही यूजर इनपुट बॉक्स पर क्लिक करेगा, स्वागत संदेश गायब हो जाएगा
    userInput.addEventListener('focus', () => {
        const welcomeElement = document.getElementById('welcomeMsg');
        if (welcomeElement) {
            welcomeElement.remove();
        }
    });

    async function askQuestion() {
        const rawQuery = userInput.value.trim();
        if (!rawQuery) return;

        // यदि स्वागत संदेश अभी भी है, तो पूछने पर उसे हटा दें
        const welcomeElement = document.getElementById('welcomeMsg');
        if (welcomeElement) {
            welcomeElement.remove();
        }

        appendMessage(rawQuery, 'user-msg');
        userInput.value = '';

        const lowerQuery = rawQuery.toLowerCase();
        const wantsMCQ = lowerQuery.includes('mcq') || lowerQuery.includes('प्रश्न') || lowerQuery.includes('question') || lowerQuery.includes('test') || lowerQuery.includes('mock');

        let finalPrompt = "";

        if (wantsMCQ) {
            finalPrompt = `आप GDS से MTS, Postman, और PA/SA विभागीय परीक्षा के एक एक्सपर्ट ट्रेनर हैं। 
            यूजर का टॉपिक/चैप्टर यह है: "${rawQuery}"।
            इस चैप्टर से संबंधित परीक्षा पैटर्न (2020 से 2026 तक के रुझान) के आधार पर कम से कम 30 से 50 महत्वपूर्ण बहुविकल्पीय प्रश्न (MCQs) बनाएं।
            हर प्रश्न के बाद उसका सही उत्तर (Answer) और संक्षिप्त व्याख्या (Explanation) जरूर दें। जवाब स्पष्ट और अच्छी फॉर्मेटिंग में होना चाहिए।`;
        } else {
            finalPrompt = `आप GDS से MTS, Postman, और PA/SA विभागीय परीक्षा के एक एक्सपर्ट गाइड हैं। 
            यूजर का सवाल है: "${rawQuery}"।
            कृपया इसके बारे में सटीक, स्पष्ट और पूरी जानकारी (नियम, विवरण या सिलेबस) हिंदी में आसान भाषा में समझाएं।`;
        }

        const loadingHTML = `
            <div class="loading-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>`;
        appendMessage(loadingHTML, 'ai-msg', true);
        const loadingMsgElement = chatBox.lastChild;

        try {
            const response = await fetch(`${BACKEND_URL}/api/ask-ai`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: finalPrompt }) 
            });

            const data = await response.json();
            loadingMsgElement.remove(); 

            if (data.answer) {
                let formattedAnswer = data.answer
                    .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>') 
                    .replace(/\*(.*?)\*/g, '<i>$1</i>')   
                    .replace(/\n/g, '<br>');               

                appendMessage(formattedAnswer, 'ai-msg', true);
            } else {
                appendMessage('क्षमा करें, मैं आपके सवाल का जवाब प्रोसेस नहीं कर पाया। कृपया फिर से प्रयास करें। 🔄', 'ai-msg');
            }
        } catch (error) {
            loadingMsgElement.remove();
            console.error("Frontend Error:", error);
            appendMessage('सर्वर से संपर्क नहीं हो पाया। कृपया अपना इंटरनेट कनेक्शन चेक करें। 🌐', 'ai-msg');
        }
    }

    sendBtn.onclick = askQuestion;
    userInput.onkeypress = (e) => { if (e.key === 'Enter') askQuestion(); };
</script>
</body>
</html>
