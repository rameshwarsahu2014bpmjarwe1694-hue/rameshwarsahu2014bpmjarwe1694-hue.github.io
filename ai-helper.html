<!DOCTYPE html>
<html lang="hi">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAMESHWAR SAHU AI STUDY & CREATOR HUB</title>
    <style>
        :root { 
            --primary: #007bff; 
            --dark: #2c3e50; 
            --bg: #f0f2f5; 
            --success: #28a745;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        
        body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            background: var(--bg);
            display: flex;
            overflow: hidden;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 100vh;
            height: 100dvh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background: #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        .chat-header {
            padding: 15px 20px;
            background: var(--dark);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .back-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        .back-btn:hover { background: rgba(255,255,255,0.35); }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f9fafb;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .message { 
            padding: 14px 18px; 
            border-radius: 12px; 
            max-width: 90%; 
            font-size: 15px; 
            line-height: 1.6; 
            word-wrap: break-word; 
        }
        .user-msg { background: var(--primary); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-msg { background: #ffffff; color: #2c3e50; align-self: flex-start; border-bottom-left-radius: 2px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid #e1e4e8; }

        .action-card {
            background: #f1f8ff;
            border: 1px solid #c8e1ff;
            padding: 12px 15px;
            border-radius: 8px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .action-btn {
            background: var(--success);
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
        }
        .action-btn:hover { background: #218838; }

        .legal-disclaimer {
            font-size: 11px;
            color: #7f8c8d;
            background: #fff3cd;
            border: 1px solid #ffeeba;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            line-height: 1.4;
        }

        .loading-dots { display: flex; gap: 4px; justify-content: center; align-items: center; height: 20px; }
        .dot { width: 8px; height: 8px; background: #90a4ae; border-radius: 50%; animation: blink 1.4s infinite both; }
        .dot:nth-child(2) { animation-delay: .2s; }
        .dot:nth-child(3) { animation-delay: .4s; }
        @keyframes blink { 0% { opacity: .2; } 20% { opacity: 1; } 100% { opacity: .2; } }

        .input-area { 
            display: flex; 
            flex-direction: column; 
            padding: 15px; 
            border-top: 1px solid #ddd; 
            background: #fff; 
            flex-shrink: 0;
        }
        .input-row { display: flex; width: 100%; gap: 10px; }
        input { flex: 1; padding: 12px 15px; border: 2px solid #ddd; border-radius: 8px; outline: none; font-size: 15px; }
        input:focus { border-color: var(--primary); }
        
        button.send-btn { background: var(--primary); color: white; border: none; padding: 0 25px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px; }
        button.send-btn:hover { background: #0056b3; }
        
        .footer-note { text-align: center; font-size: 11px; color: #aaa; margin-top: 8px; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <button class="back-btn" onclick="window.location.href='dashboard.html'">⬅ Back</button>
        <span style="font-weight: bold;">🤖 RAMESHWAR SAHU AI STUDY HUB (Smart Assistant)</span>
    </div>
    
    <div class="chat-box" id="chatBox">
        <div class="message ai-msg" id="defaultWelcome">
            लोड हो रहा है... कृपया प्रतीक्षा करें...⏳
        </div>
    </div>
    
    <div class="input-area">
        <div class="input-row">
            <input type="text" id="userInput" placeholder="यहाँ पूछें: जैसे 'Excel शीट डाउनलोड करनी है', 'लेटर लिखो', या 'मैथ्स सवाल'...">
            <button class="send-btn" id="sendBtn">भेजें</button>
        </div>
        <div class="footer-note">AI महत्वपूर्ण नियमों या डेटा को गलत पेश कर सकता है। कृपया विभागीय गाइड से पुष्टि करें।</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    
    const BACKEND_URL = "https://payment-backend-2-g6go.onrender.com";
    
    const configRes = await fetch(`${BACKEND_URL}/firebase-config`);
    if (!configRes.ok) throw new Error("Firebase config load failed");
    const firebaseConfig = await configRes.json();

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    function appendMessage(text, className, isHTML = false) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        if (isHTML) msgDiv.innerHTML = text;
        else msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight; 
    }

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            let userName = user.displayName || user.email.split('@')[0] || "Student";
            
            const welcomeHTML = `
                <b>स्वागत है, ${userName}!</b> 👋<br>
                मैं <b>RAMESHWAR SAHU AI STUDY HUB</b> का स्मार्ट असिस्टेंट हूँ। 🤖<br><br>
                आप मुझसे किसी भी तरह की बात सीधे चैट में कह सकते हैं, बटन की कोई ज़रूरत नहीं है:
                <ul style="margin-left: 20px; margin-top: 5px;">
                    <li><b>"मुझे Excel रिपोर्ट डाउनलोड करनी है"</b> बोलें, और लिंक मिल जाएगा।</li>
                    <li><b>"मैथ्स हल करो: (25 * 4) + 10"</b> लिखें और तुरंत जवाब पाएं।</li>
                    <li><b>"विभागीय पत्र ड्राफ्ट करो..."</b> लिखकर ऑफिशियल लेटर बनवाएं।</li>
                    <li><b>"वीडियो लेक्चर बनाओ..."</b> लिखकर वीडियो एसेट्स तैयार करें।</li>
                    <li>या सामान्य रूप से <b>जीके, पोस्टल रूल्स और एमसीक्यू (MCQ)</b> पूछें।</li>
                </ul>
                <br>अपना निर्देश नीचे टाइप करें! ✨`;

            chatBox.innerHTML = ''; 
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ai-msg';
            msgDiv.id = 'welcomeMsg'; 
            msgDiv.innerHTML = welcomeHTML;
            chatBox.appendChild(msgDiv);
        } else {
            alert("Security Alert: Please login first!");
            window.location.href = "login.html"; 
        }
    });

    userInput.addEventListener('focus', () => {
        const welcomeElement = document.getElementById('welcomeMsg');
        if (welcomeElement) welcomeElement.remove();
    });

    // Smart Conversational Router (AI automatically detects user intent from text)
    async function handleUserMessage() {
        const queryText = userInput.value.trim();
        if (!queryText) return;

        const welcomeElement = document.getElementById('welcomeMsg');
        if (welcomeElement) welcomeElement.remove();

        appendMessage(queryText, 'user-msg');
        userInput.value = '';

        const lowerQuery = queryText.toLowerCase();

        const loadingHTML = `<div class="loading-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
        appendMessage(loadingHTML, 'ai-msg', true);
        const loadingMsgElement = chatBox.lastChild;

        try {
            const secureToken = window.APP_SECRET || "";
            let endpoint = `${BACKEND_URL}/api/ask-ai`;
            let payload = { question: queryText };
            let isExcel = false;
            let isMath = false;

            // 1. Intent Detection based on User Text
            if (lowerQuery.includes('excel') || lowerQuery.includes('xlsx') || lowerQuery.includes('शीट डाउनलोड')) {
                isExcel = true;
            } else if (lowerQuery.includes('math') || lowerQuery.includes('हल करो') || lowerQuery.includes('calculate') || /[\d\+\-\*\/\(\)]+/.test(lowerQuery) && lowerQuery.length < 30) {
                // Agar math expression ya solve karne ko kaha gaya ho
                endpoint = `${BACKEND_URL}/api/solve-math`;
                // Extract clean mathematical expression
                payload = { expression: queryText.replace(/[^0-9\+\-\*\/\(\)\.\s]/g, '') || queryText };
                isMath = true;
            } else if (lowerQuery.includes('video') || lowerQuery.includes('lecture') || lowerQuery.includes('वीडियो बना')) {
                endpoint = `${BACKEND_URL}/api/step2-generate-assets`;
                payload = { text: queryText };
            } else if (lowerQuery.includes('letter') || lowerQuery.includes('पत्र') || lowerQuery.includes('application')) {
                payload = { question: `एक औपचारिक विभागीय पत्र या आवेदन इस विषय पर ड्राफ्ट करें: ${queryText}` };
            }

            // 2. Excel Request Handler (Direct Action Card generation)
            if (isExcel) {
                loadingMsgElement.remove();
                const excelHTML = `
                    📊 आपकी <b>GDS Exam Excel Report</b> तैयार है! नीचे दिए गए बटन पर क्लिक करके इसे सीधे डाउनलोड करें:
                    <div class="action-card">
                        <span>📁 GDS_Report.xlsx</span>
                        <a href="${BACKEND_URL}/api/generate-excel" class="action-btn" target="_blank">⬇️ Download Excel</a>
                    </div>`;
                appendMessage(excelHTML, 'ai-msg', true);
                return;
            }

            // 3. API Request Dispatch
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'X-Source-Auth': secureToken
                },
                body: JSON.stringify(payload) 
            });

            const data = await response.json();
            loadingMsgElement.remove(); 

            if (data.answer || data.result !== undefined) {
                let output = data.answer || `गणितीय हल (Math Result): <b>${data.result}</b>`;
                let formattedOutput = output.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
                appendMessage(formattedOutput, 'ai-msg', true);
            } else if (data.success && data.audioUrl) {
                const videoCardHTML = `
                    🎬 आपके वीडियो एसेट्स और ऑडियो सफलतापूर्वक जनरेट हो गए हैं!
                    <div class="action-card">
                        <span>🔊 Voiceover Audio Lecture</span>
                        <a href="${data.audioUrl}" class="action-btn" target="_blank">🎧 Play / Listen</a>
                    </div>`;
                appendMessage(videoCardHTML, 'ai-msg', true);
            } else {
                appendMessage('क्षमा करें, मैं इस निर्देश को प्रोसेस नहीं कर पाया। कृपया दोबारा प्रयास करें।', 'ai-msg');
            }
        } catch (error) {
            loadingMsgElement.remove();
            console.error("Error:", error);
            appendMessage('सर्वर से संपर्क नहीं हो पाया। कृपया अपना इंटरनेट कनेक्शन जाँचें।', 'ai-msg');
        }
    }

    sendBtn.onclick = handleUserMessage;
    userInput.onkeypress = (e) => { if (e.key === 'Enter') handleUserMessage(); };
</script>
</body>
</html>
