<!DOCTYPE html>
<html>
<head>
<title>Admin Payment Dashboard</title>
<style>
body{font-family:Arial;background:#0f172a;color:#fff;padding:20px}
.card{background:#1e293b;padding:15px;margin:10px 0;border-radius:10px}
.btn{padding:8px 12px;margin:5px;border:none;cursor:pointer;border-radius:6px}
.approve{background:green;color:#fff}
.reject{background:red;color:#fff}
small{color:#aaa}
</style>
</head>
<body>

<h2>💰 Admin Payment Dashboard</h2>  
<div id="list">Loading...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
    getFirestore, collection, getDocs, updateDoc, setDoc, doc, 
    serverTimestamp, deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyDjzmo0A4KhOkrqFQdOyCEek6bsPF-UVPQ",
    authDomain: "gds-departmental-exam-studyhub.firebaseapp.com",
    databaseURL: "https://gds-departmental-exam-studyhub-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "gds-departmental-exam-studyhub",
    storageBucket: "gds-departmental-exam-studyhub.firebasestorage.app",
    messagingSenderId: "759916756080",
    appId: "1:759916756080:web:7f2c0e66458bd007e888b5"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const BACKEND_URL = "https://payment-backend-2-g6go.onrender.com";
const ADMIN_EMAIL = "rameshwarsahu2014bpmjarwe1694@gmail.com";

onAuthStateChanged(auth, (user) => {
    if (!user || user.email !== ADMIN_EMAIL) {
        document.body.innerHTML = "<h2>❌ Access Denied</h2>";
        return;
    }
    loadData();
});

async function loadData() {
    const box = document.getElementById("list");
    box.innerHTML = "Loading...";

    try {
        const usersSnap = await getDocs(collection(db, "payments"));
        box.innerHTML = "";
        
        for (const user of usersSnap.docs) {
            const txSnap = await getDocs(collection(db, "payments", user.id, "transactions"));
            txSnap.forEach(d => {
                const t = d.data();
                if (t.status !== "pending") return;
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <div><b>User:</b> ${user.id}</div>
                    <div><b>Txn ID:</b> ${t.transactionId || "-"}</div>
                    <div><b>Request:</b> ${t.requested_for || "-"}</div>
                    <div><b>Status:</b> ${t.status || "pending"}</div>
                    <small>${t.submittedAt ? "Submitted" : ""}</small><br>
                    <button class="btn approve" data-email="${user.id}" data-tid="${d.id}">Approve</button>
                    <button class="btn reject" data-email="${user.id}" data-tid="${d.id}">Reject</button>
                    <button class="btn delete" data-email="${user.id}" data-tid="${d.id}" style="background:#444">Delete</button>
                `;
                box.appendChild(card);
            });
        }

        // Add Event Listeners
        document.querySelectorAll('.approve').forEach(btn => btn.onclick = () => handleApprove(btn.dataset.email, btn.dataset.tid));
        document.querySelectorAll('.reject').forEach(btn => btn.onclick = () => handleReject(btn.dataset.email, btn.dataset.tid));
        document.querySelectorAll('.delete').forEach(btn => btn.onclick = () => handleDelete(btn.dataset.email, btn.dataset.tid));

    } catch (e) {
        box.innerHTML = "Error loading data: " + e.message;
    }
}

async function handleApprove(email, transactionId) {
    if (!confirm("क्या आप इसे Approve करना चाहते हैं?")) return;

    try {
        // 'true' force refresh करता है, जिससे नया टोकन मिलता है
        const user = auth.currentUser;
        if (!user) {
            alert("आप लॉगिन नहीं हैं!");
            return;
        }
        
        const token = await user.getIdToken(true); 
        
        const res = await fetch(`${BACKEND_URL}/admin/approve-payment`, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`, // यहाँ टोकन जा रहा है
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email, transactionId })
        });

        if (res.ok) {
            alert("Approved ✔");
            loadData();
        } else {
            const errData = await res.json();
            alert("Failed: " + (errData.error || "Unknown Error"));
        }
    } catch (e) { 
        console.error(e);
        alert("Error: " + e.message); 
    }
}


async function handleReject(email, tid) {
    try {
        await updateDoc(doc(db, "payments", email, "transactions", tid), { status: "rejected" });
        await setDoc(doc(db, "payments", email), { status: "pending" }, { merge: true });
        alert("Rejected ❌");
        loadData();
    } catch (e) { alert("Error: " + e.message); }
}

async function handleDelete(email, tid) {
    if(!confirm("Permanently delete this transaction?")) return;
    try {
        await deleteDoc(doc(db, "payments", email, "transactions", tid));
        alert("Deleted Successfully");
        loadData();
    } catch (e) {
        alert("Error: " + e.message);
    }
};
    window.loadData = loadData;   
</script>
</body>
</html>
