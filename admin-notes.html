<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Notes Panel</title>
<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:Arial,Helvetica,sans-serif; }
body{ background:linear-gradient(135deg,#0f2027,#203a43,#2c5364); padding:18px; min-height:100vh; }
.wrap{ max-width:1000px; margin:auto; }
.title{ background:#111; color:#fff; padding:16px; text-align:center; font-size:24px; font-weight:700; border-radius:14px; margin-bottom:18px; }
.card{ background:#fff; padding:18px; border-radius:16px; box-shadow:0 6px 14px rgba(0,0,0,.10); margin-bottom:18px; }
h2{ font-size:20px; margin-bottom:14px; color:#111; }
input,select,textarea{ width:100%; padding:13px; border:1px solid #ddd; border-radius:12px; outline:none; font-size:15px; margin-bottom:12px; }
textarea{ min-height:120px; resize:vertical; }
button{ width:100%; padding:13px; border:none; border-radius:12px; font-size:16px; font-weight:700; cursor:pointer; }
.saveBtn{ background:#1565c0; color:#fff; }
.delBtn{ margin-top:10px; background:#e53935; color:#fff; }
.item{ border:1px solid #eee; padding:15px; border-radius:14px; margin-bottom:12px; background:#fafafa; }
.name{ font-weight:700; font-size:18px; margin-bottom:6px; color:#111; }
.meta{ font-size:14px; color:#555; margin:4px 0; word-break:break-word; }
.empty{ text-align:center; color:#777; padding:20px; }
.back{ display:block; margin-top:14px; text-align:center; padding:14px; background:#111; color:#fff; text-decoration:none; border-radius:12px; font-weight:700; }
</style>
</head>
<body>

<div class="wrap">
<div class="title">📚 Admin Notes Panel</div>

<div class="card">
<h2>Upload New Note</h2>
<input type="text" id="titleInput" placeholder="Enter note title">
  
<select id="postFilter">
<option value="MTS">MTS</option>
<option value="POSTMAN">POSTMAN</option>
<option value="PA/SA">PA/SA</option>
</select>

<select id="subFilter">
<option value="GK">GK</option>
<option value="Maths">Maths</option>
<option value="Reasoning">Reasoning</option>
<option value="PO GUIDE 1">PO Guide 1</option>
<option value="PO GUIDE 2">PO Guide 2</option>
<option value="POSTAL MANUAL 5">Postal Manual Vol 5</option>
<option value="POSTAL MANUAL 6">Postal Manual Vol 6 Part 3</option>
<option value="POSTAL MANUAL 7">Postal Manual Vol 7</option>
</select>

<textarea id="descInput" placeholder="Write description / text note"></textarea>
<input type="text" id="imageInput" placeholder="Paste GitHub Raw Image URL">
<input type="text" id="fileNameInput" placeholder="Enter PDF Filename (e.g. postal-manual-5.pdf)">

<button class="saveBtn" onclick="uploadNote()">Save Note to Firestore</button>
</div>

<div class="card">
<h2>All Uploaded Notes</h2>
<div id="listBox" class="empty">Loading...</div>
</div>

<a href="admin-panel.html" class="back">⬅ Back to Admin Panel</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// --- YAHAN APNI FIREBASE CONFIG DALO ---
const firebaseConfig = {
            apiKey: "AIzaSyDjzmo0A4KhOkrqFQdOyCEek6bsPF-UVPQ",
            authDomain: "gds-departmental-exam-studyhub.firebaseapp.com",
            projectId: "gds-departmental-exam-studyhub",
            storageBucket: "gds-departmental-exam-studyhub.appspot.com",
            messagingSenderId: "759916756080",
            appId: "1:759916756080:web:7f2c0e66458bd007e888b5"
        };
  
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

function safe(v){ return String(v || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;"); }

onAuthStateChanged(auth, (user) => {
    if(!user || user.email !== "rameshwarsahu2014bpmjarwe1694@gmail.com"){ location.href="login.html"; return; }
    loadNotes();
});

window.uploadNote = async function(){
    const title = document.getElementById("titleInput").value.trim();
    const category = document.getElementById("postFilter").value;
    const subject = document.getElementById("subFilter").value;
    const desc = document.getElementById("descInput").value.trim();
    const imageURL = document.getElementById("imageInput").value.trim();
    const fileName = document.getElementById("fileNameInput").value.trim();

    if(!title || !imageURL || !fileName){ alert("Title, Image URL aur PDF Filename sab bharein!"); return; }

    try{
        await addDoc(collection(db, "notes"),{
            title, category, subject, description:desc, imageURL, fileName, createdAt:serverTimestamp()
        });
        alert("Saved Successfully to Firestore");
        location.reload();
    }catch(error){ alert("Save Failed: " + error.message); }
}

async function loadNotes(){
    const box = document.getElementById("listBox");
    try{
        const q = query(collection(db, "notes"), orderBy("createdAt","desc"));
        const snap = await getDocs(q);
        if(snap.empty){ box.innerHTML = `<div class="empty">No notes uploaded</div>`; return; }
        let html = "";
        snap.forEach((d)=>{
            const x = d.data();
            html += `<div class="item"><div class="name">${safe(x.title)}</div><div class="meta">📘 Category: ${safe(x.category)} | Subject: ${safe(x.subject)}</div><div class="meta">${safe(x.description)}</div>
            <button class="delBtn" onclick="deleteNote('${d.id}')">Delete</button></div>`;
        });
        box.innerHTML = html;
    }catch(error){ box.innerHTML = `<div class="empty">Failed to load</div>`; }
}

window.deleteNote = async function(id){
    if(!confirm("Delete this?")) return;
    await deleteDoc(doc(db, "notes", id));
    alert("Deleted");
    loadNotes();
}
</script>
</body>
</html>
